[package]
name = "meetodds"
version = "0.4.20"
description = "MeetOdds local-first meeting capture, transcription, and summaries"
authors = ["MeetOdds contributors"]
license = "MIT"
repository = "https://github.com/kamatbot/notes"
edition = "2021"
rust-version = "1.77"
autobins = false

[[bin]]
name = "meetodds"
path = "src/main.rs"

# Developer performance harness. An example target is never bundled by Tauri:
#   cargo run --release --example perf_baseline -- --engine parakeet
[[example]]
name = "perf_baseline"
path = "tools/perf_baseline.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["platform-default"]
platform-default = []
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
hipblas = ["whisper-rs/hipblas"]
openblas = ["whisper-rs/openblas"]
openmp = ["whisper-rs/openmp"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"
zip = "2.2"
tar = "0.4"
xz2 = "0.1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
posthog-rs = "0.3.7"
cpal = "0.15.3"
clap = { version = "4.3", features = ["derive"] }
chrono = { version = "0.4.31", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"
bytemuck = "1.16.1"
ebur128 = "0.1"
nnnoiseless = "0.5"
futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }
ort = { version = "2.0.0-rc.10" }
thiserror = "2.0.16"
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
crossbeam = "0.8.4"
dashmap = "6.1.0"
dirs = "5.0.1"
libc = "0.2"
url = "2.5.0"
sysinfo = "0.32"
lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }
esaxx-rs = "0.1.10"
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rand = "0.8.5"
rayon = "1.10"
rubato = "0.15.0"
ringbuf = "0.4.8"
tempfile = "3.3.0"
whatlang = "0.16.4"
ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-process = "2.3.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.3.7"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
once_cell = "1.17.1"
objc = "0.2.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
anyhow = "1.0"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
core-graphics = "0.23"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
dasp = "0.11.0"
futures-channel = "0.3.31"
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
futures-channel = "0.3.31"

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
futures-channel = "0.3.31"

[dev-dependencies]
tempfile = "3.3.0"
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
strsim = "0.10.0"
