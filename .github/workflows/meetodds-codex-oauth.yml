name: Wire and validate ChatGPT subscription Codex OAuth

on:
  push:
    branches: [feature/meetodds-openai-cloud]
    paths:
      - .github/workflows/meetodds-codex-oauth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/meetodds-openai-cloud
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wire Codex OAuth through summary engine and settings
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"Missing anchor in {path}: {old[:180]!r}")

          def replace_all(path: str, old: str, new: str, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count >= minimum:
                  p.write_text(text.replace(old, new))
                  return
              if new in text:
                  return
              raise SystemExit(f"Missing repeated anchor in {path}: {old[:180]!r}")

          # --- Rust: make the MeetOdds-owned Codex credential store usable from the
          # summary engine, which already passes the app-data directory to LLM clients.
          codex = Path('frontend/src-tauri/src/openai_codex.rs')
          text = codex.read_text()
          marker = '''async fn request_models(\n    client: &Client,\n    auth: &CodexAuthState,\n) -> Result<reqwest::Response, String> {'''
          helpers = '''async fn load_valid_auth_from_dir(\n    app_data_dir: &Path,\n    client: &Client,\n) -> Result<CodexAuthState, String> {\n    let _guard = AUTH_LOCK.lock().await;\n    let path = app_data_dir.join(AUTH_FILE_NAME);\n    let auth = read_auth(&path)?.ok_or_else(|| {\n        "OpenAI Codex is not connected. Sign in with your ChatGPT subscription in MeetOdds settings."\n            .to_string()\n    })?;\n    if token_needs_refresh(&auth) {\n        refresh_auth_with_client(client, &path, &auth).await\n    } else {\n        Ok(auth)\n    }\n}\n\nasync fn force_refresh_from_dir(\n    app_data_dir: &Path,\n    client: &Client,\n) -> Result<CodexAuthState, String> {\n    let _guard = AUTH_LOCK.lock().await;\n    let path = app_data_dir.join(AUTH_FILE_NAME);\n    let auth = read_auth(&path)?.ok_or_else(|| {\n        "OpenAI Codex is not connected. Sign in again in MeetOdds settings.".to_string()\n    })?;\n    refresh_auth_with_client(client, &path, &auth).await\n}\n\n'''
          if 'async fn load_valid_auth_from_dir(' not in text:
              if marker not in text:
                  raise SystemExit('Codex request_models anchor changed')
              text = text.replace(marker, helpers + marker, 1)

          text = text.replace(
              '''pub async fn generate_codex_summary<R: Runtime>(\n    client: &Client,\n    app: &AppHandle<R>,''',
              '''pub async fn generate_codex_summary(\n    client: &Client,\n    app_data_dir: &Path,''',
              1,
          )
          # Only the generation function has these exact local calls after the signature.
          gen_start = text.index('pub async fn generate_codex_summary(')
          before, generation = text[:gen_start], text[gen_start:]
          generation = generation.replace('load_valid_auth(app, client).await?', 'load_valid_auth_from_dir(app_data_dir, client).await?', 1)
          generation = generation.replace('force_refresh(app, client).await?', 'force_refresh_from_dir(app_data_dir, client).await?', 1)
          text = before + generation
          text = text.replace(
              '''    let trimmed = body.trim();\n    if trimmed.len() <= 600 {\n        return trimmed.to_string();\n    }\n    format!("{}…", &trimmed[..600])''',
              '''    let trimmed = body.trim();\n    if trimmed.chars().count() <= 600 {\n        return trimmed.to_string();\n    }\n    format!("{}…", trimmed.chars().take(600).collect::<String>())''',
              1,
          )
          text = text.replace(
              '''    apply_codex_headers(client.post(url), auth, true)\n        .json(&body)''',
              '''    apply_codex_headers(client.post(url), auth, true)\n        .timeout(Duration::from_secs(300))\n        .json(&body)''',
              1,
          )
          codex.write_text(text)

          # --- Rust: provider enum and dispatch.
          llm = 'frontend/src-tauri/src/summary/llm_client.rs'
          replace_once(llm, '    OpenAI,\n    Claude,', '    OpenAI,\n    OpenAICodex,\n    Claude,')
          replace_once(
              llm,
              '            "openai" => Ok(Self::OpenAI),\n            "claude" => Ok(Self::Claude),',
              '            "openai" => Ok(Self::OpenAI),\n            "openai-codex" | "codex" | "chatgpt" => Ok(Self::OpenAICodex),\n            "claude" => Ok(Self::Claude),',
          )
          replace_once(
              llm,
              '''    // Handle BuiltInAI provider separately (uses local sidecar, no HTTP API)\n    if provider == &LLMProvider::BuiltInAI {''',
              '''    // OpenAI Codex is a separate subscription-backed provider. It uses the\n    // MeetOdds-owned OAuth session in app data and the Codex Responses backend.\n    if provider == &LLMProvider::OpenAICodex {\n        let app_data_dir = app_data_dir\n            .ok_or_else(|| "app_data_dir is required for OpenAI Codex provider".to_string())?;\n        return crate::openai_codex::generate_codex_summary(\n            client,\n            app_data_dir,\n            model_name,\n            system_prompt,\n            user_prompt,\n            cancellation_token,\n        )\n        .await;\n    }\n\n    // Handle BuiltInAI provider separately (uses local sidecar, no HTTP API)\n    if provider == &LLMProvider::BuiltInAI {''',
          )
          replace_once(
              llm,
              '''        LLMProvider::BuiltInAI => {\n            // This case is handled earlier with early returns\n            unreachable!("BuiltInAI is handled before this match statement")\n        }''',
              '''        LLMProvider::BuiltInAI => {\n            unreachable!("BuiltInAI is handled before this match statement")\n        }\n        LLMProvider::OpenAICodex => {\n            unreachable!("OpenAICodex is handled before this match statement")\n        }''',
          )
          replace_once(
              llm,
              '        LLMProvider::OpenAI => "OpenAI",\n        LLMProvider::Claude => "Claude",',
              '        LLMProvider::OpenAI => "OpenAI",\n        LLMProvider::OpenAICodex => "OpenAI Codex (ChatGPT subscription)",\n        LLMProvider::Claude => "Claude",',
          )

          service = 'frontend/src-tauri/src/summary/service.rs'
          replace_once(
              service,
              '''        let api_key = if provider == LLMProvider::Ollama || provider == LLMProvider::BuiltInAI || provider == LLMProvider::CustomOpenAI {''',
              '''        let api_key = if provider == LLMProvider::Ollama\n            || provider == LLMProvider::BuiltInAI\n            || provider == LLMProvider::CustomOpenAI\n            || provider == LLMProvider::OpenAICodex\n        {''',
          )

          settings = 'frontend/src-tauri/src/database/repositories/setting.rs'
          replace_once(
              settings,
              '            "builtin-ai" => return Ok(()), // No API key needed\n            _ => {',
              '            "builtin-ai" => return Ok(()), // No API key needed\n            "openai-codex" => return Ok(()), // Uses MeetOdds-owned OAuth tokens\n            _ => {',
          )
          replace_once(
              settings,
              '            "builtin-ai" => return Ok(None), // No API key needed\n            _ => {',
              '            "builtin-ai" => return Ok(None), // No API key needed\n            "openai-codex" => return Ok(None), // OAuth credentials live outside SQLite\n            _ => {',
          )
          # delete_api_key contains a second Ok(()) match.
          p = Path(settings)
          text = p.read_text()
          needle = '            "builtin-ai" => return Ok(()), // No API key needed\n            _ => {'
          replacement = '            "builtin-ai" => return Ok(()), // No API key needed\n            "openai-codex" => return Ok(()), // OAuth credentials live outside SQLite\n            _ => {'
          if needle in text:
              text = text.replace(needle, replacement, 1)
          p.write_text(text)

          lib = 'frontend/src-tauri/src/lib.rs'
          replace_once(lib, 'pub mod openai;\npub mod anthropic;', 'pub mod openai;\npub mod openai_codex;\npub mod anthropic;')
          replace_once(
              lib,
              '            openai::openai::get_openai_models,\n            anthropic::anthropic::get_anthropic_models,',
              '''            openai::openai::get_openai_models,\n            openai_codex::openai_codex_start_device_auth,\n            openai_codex::openai_codex_poll_device_auth,\n            openai_codex::openai_codex_get_auth_status,\n            openai_codex::openai_codex_logout,\n            openai_codex::openai_codex_get_models,\n            anthropic::anthropic::get_anthropic_models,''',
          )

          # --- TypeScript provider types and non-API-key behavior.
          for path in [
              'frontend/src/services/configService.ts',
              'frontend/src/components/ModelSettingsModal.tsx',
          ]:
              replace_once(
                  path,
                  "'openai' | 'openrouter' | 'builtin-ai' | 'custom-openai'",
                  "'openai' | 'openai-codex' | 'openrouter' | 'builtin-ai' | 'custom-openai'",
              )

          context = 'frontend/src/contexts/ConfigContext.tsx'
          replace_once(
              context,
              "    openai: ['gpt-4', 'gpt-4-turbo', 'gpt-3.5-turbo'],\n    'builtin-ai': [],",
              "    openai: ['gpt-5.6', 'gpt-5.6-terra', 'gpt-5.6-luna'],\n    'openai-codex': ['gpt-5.6-sol', 'gpt-5.6-terra', 'gpt-5.6-luna', 'gpt-5.5', 'gpt-5.4'],\n    'builtin-ai': [],",
          )

          use_model = 'frontend/src/hooks/meeting-details/useModelConfiguration.ts'
          replace_once(
              use_model,
              "          if (data.provider !== 'ollama' && data.provider !== 'custom-openai' && !data.apiKey) {",
              "          if (data.provider !== 'ollama' && data.provider !== 'custom-openai' && data.provider !== 'openai-codex' && !data.apiKey) {",
          )

          modal = 'frontend/src/components/ModelSettingsModal.tsx'
          replace_once(
              modal,
              "import { toast } from 'sonner';",
              "import { toast } from 'sonner';\nimport { OpenAICodexSettings } from '@/components/OpenAICodexSettings';",
          )
          replace_once(
              modal,
              "const CLAUDE_FALLBACK_MODELS = [",
              "const CODEX_FALLBACK_MODELS = [\n  'gpt-5.6-sol',\n  'gpt-5.6-terra',\n  'gpt-5.6-luna',\n  'gpt-5.5',\n  'gpt-5.4-mini',\n  'gpt-5.4',\n  'gpt-5.3-codex',\n  'gpt-5.3-codex-spark',\n];\n\nconst CLAUDE_FALLBACK_MODELS = [",
          )
          replace_once(
              modal,
              "  const [openaiModels, setOpenaiModels] = useState<string[]>([]);\n  const [claudeModels, setClaudeModels] = useState<string[]>([]);",
              "  const [openaiModels, setOpenaiModels] = useState<string[]>([]);\n  const [codexModels, setCodexModels] = useState<string[]>([]);\n  const [codexConnected, setCodexConnected] = useState<boolean>(false);\n  const [claudeModels, setClaudeModels] = useState<string[]>([]);",
          )
          replace_once(
              modal,
              "    openai: openaiModels.length > 0 ? openaiModels : OPENAI_FALLBACK_MODELS,\n    openrouter: openRouterModels.map((m) => m.id),",
              "    openai: openaiModels.length > 0 ? openaiModels : OPENAI_FALLBACK_MODELS,\n    'openai-codex': codexModels.length > 0 ? codexModels : CODEX_FALLBACK_MODELS,\n    openrouter: openRouterModels.map((m) => m.id),",
          )
          replace_once(
              modal,
              '''  const isDoneDisabled =\n    (requiresApiKey && (!apiKey || (typeof apiKey === 'string' && !apiKey.trim()))) ||\n    (modelConfig.provider === 'ollama' && ollamaEndpointChanged) ||\n    isCustomOpenAIInvalid;''',
              '''  const isDoneDisabled =\n    (requiresApiKey && (!apiKey || (typeof apiKey === 'string' && !apiKey.trim()))) ||\n    (modelConfig.provider === 'openai-codex' && !codexConnected) ||\n    (modelConfig.provider === 'ollama' && ollamaEndpointChanged) ||\n    isCustomOpenAIInvalid;''',
          )
          replace_once(
              modal,
              "          if (data.provider !== 'ollama' && !data.apiKey) {",
              "          if (data.provider !== 'ollama' && data.provider !== 'openai-codex' && !data.apiKey) {",
          )
          replace_once(
              modal,
              '''  }, [models, openRouterModels, builtinAiModels, openaiModels, claudeModels, groqModels, modelConfig.provider]);''',
              '''  }, [models, openRouterModels, builtinAiModels, openaiModels, codexModels, claudeModels, groqModels, modelConfig.provider]);''',
          )
          replace_once(
              modal,
              "      apiKey: typeof apiKey === 'string' ? apiKey.trim() || null : null,",
              "      apiKey: modelConfig.provider === 'openai-codex' ? null : (typeof apiKey === 'string' ? apiKey.trim() || null : null),",
          )
          replace_once(
              modal,
              '                <SelectItem value="openai">OpenAI Cloud API</SelectItem>\n                <SelectItem value="openrouter">OpenRouter</SelectItem>',
              '                <SelectItem value="openai-codex">OpenAI Codex (ChatGPT subscription)</SelectItem>\n                <SelectItem value="openai">OpenAI Cloud API</SelectItem>\n                <SelectItem value="openrouter">OpenRouter</SelectItem>',
          )

          p = Path(modal)
          text = p.read_text()
          old_alert = '''        {modelConfig.provider === 'openai' && (\n          <Alert className="border-blue-200 bg-blue-50">\n            <AlertDescription className="space-y-2 text-sm text-blue-950">\n              <p>\n                <strong>OpenAI Cloud</strong> sends summary requests to OpenAI using the API key you provide.\n                ChatGPT Plus/Pro subscriptions and OpenAI API billing are separate.\n              </p>\n              <p className="text-xs text-blue-800">\n                OpenAI's "Sign in with ChatGPT" is an identity sign-in and does not grant third-party apps\n                ChatGPT subscription usage for API calls, so MeetOdds does not offer a misleading OAuth button.\n              </p>\n              <Button\n                type="button"\n                variant="link"\n                size="sm"\n                className="h-auto p-0 text-blue-700"\n                onClick={() => invoke('open_external_url', { url: 'https://platform.openai.com/api-keys' })}\n              >\n                Create or manage an OpenAI API key\n                <ExternalLink className="ml-1 h-3.5 w-3.5" />\n              </Button>\n            </AlertDescription>\n          </Alert>\n        )}\n\n'''
          new_alert = '''        {modelConfig.provider === 'openai' && (\n          <Alert className="border-blue-200 bg-blue-50">\n            <AlertDescription className="space-y-2 text-sm text-blue-950">\n              <p>\n                <strong>OpenAI Cloud API</strong> uses an OpenAI API key and separate API billing.\n                To use the Codex allowance included with your ChatGPT Plus/Pro subscription instead, choose\n                <strong> OpenAI Codex (ChatGPT subscription)</strong>.\n              </p>\n              <Button\n                type="button"\n                variant="link"\n                size="sm"\n                className="h-auto p-0 text-blue-700"\n                onClick={() => invoke('open_external_url', { url: 'https://platform.openai.com/api-keys' })}\n              >\n                Create or manage an OpenAI API key\n                <ExternalLink className="ml-1 h-3.5 w-3.5" />\n              </Button>\n            </AlertDescription>\n          </Alert>\n        )}\n\n        {modelConfig.provider === 'openai-codex' && (\n          <OpenAICodexSettings\n            onConnectionChange={setCodexConnected}\n            onModelsChange={(nextModels) => {\n              setCodexModels(nextModels);\n              if (nextModels.length > 0 && !nextModels.includes(modelConfig.model)) {\n                setModelConfig((prev: ModelConfig) => ({ ...prev, model: nextModels[0] }));\n              }\n            }}\n          />\n        )}\n\n'''
          if old_alert not in text:
              raise SystemExit('OpenAI API alert anchor changed')
          text = text.replace(old_alert, new_alert, 1)
          p.write_text(text)

          # Rewrite documentation to distinguish subscription OAuth from API-key mode.
          Path('docs/OPENAI_CLOUD.md').write_text('''# OpenAI in MeetOdds\n\nMeetOdds offers two distinct OpenAI providers for meeting summaries. Recording and transcription remain local unless you explicitly choose a cloud summary provider.\n\n## 1. OpenAI Codex — ChatGPT subscription\n\nChoose **OpenAI Codex (ChatGPT subscription)** to use the Codex allowance available to your ChatGPT Plus/Pro account. MeetOdds follows the same architecture used by Hermes Agent: OpenAI's Codex device-code OAuth flow, followed by the ChatGPT Codex Responses backend. No OpenAI API key is needed for this mode.\n\nThe sign-in flow opens `https://auth.openai.com/codex/device`, stores MeetOdds' own rotating access/refresh token pair in the application's data directory, and sends summary requests to the Codex backend. Tokens are never written to the meeting database or rendered in the UI. On Unix, the token file is created with owner-only permissions.\n\nMeetOdds deliberately does **not** import `~/.codex/auth.json`. Refresh tokens rotate, so sharing the same refresh credential between MeetOdds and Codex CLI/VS Code could invalidate one of the sessions. MeetOdds owns and refreshes only the session it created.\n\nAvailable Codex models are loaded from your signed-in account. The fallback catalog includes `gpt-5.6-sol`, `gpt-5.6-terra`, `gpt-5.6-luna`, `gpt-5.5`, `gpt-5.4-mini`, `gpt-5.4`, `gpt-5.3-codex`, and `gpt-5.3-codex-spark`; the live account response is authoritative. `-pro` model variants are excluded because consumer ChatGPT Codex accounts may reject them.\n\nSubscription usage and limits are enforced by OpenAI. A 429 response is presented as a Codex usage-limit condition rather than as an API-key authentication failure.\n\n## 2. OpenAI Cloud API — API billing\n\nChoose **OpenAI Cloud API** when you want to use an OpenAI Platform API key. This mode calls `api.openai.com` and is billed separately from ChatGPT subscriptions. MeetOdds dynamically loads the API models available to your key and currently prefers the GPT-5.6 family.\n\n## Privacy boundary\n\nAudio capture and transcription can remain entirely on-device. When either OpenAI cloud provider is selected, the transcript text needed to generate or translate a meeting summary is sent to the selected OpenAI service. Local Built-in AI and Ollama remain available when no cloud processing is desired.\n\n## Compatibility\n\nThe visible application name is **MeetOdds**, while the existing `com.meetily.ai` Tauri identifier and internal Rust package name remain unchanged so upgrades continue using the existing settings, database, recordings, and model files.\n''')
          PY

          rustfmt --edition 2021 \
            frontend/src-tauri/src/openai_codex.rs \
            frontend/src-tauri/src/summary/llm_client.rs \
            frontend/src-tauri/src/summary/service.rs \
            frontend/src-tauri/src/database/repositories/setting.rs \
            frontend/src-tauri/src/lib.rs

          git add frontend/src-tauri/src/openai_codex.rs \
                  frontend/src-tauri/src/summary/llm_client.rs \
                  frontend/src-tauri/src/summary/service.rs \
                  frontend/src-tauri/src/database/repositories/setting.rs \
                  frontend/src-tauri/src/lib.rs \
                  frontend/src/services/configService.ts \
                  frontend/src/contexts/ConfigContext.tsx \
                  frontend/src/hooks/meeting-details/useModelConfiguration.ts \
                  frontend/src/components/ModelSettingsModal.tsx \
                  frontend/src/components/OpenAICodexSettings.tsx \
                  docs/OPENAI_CLOUD.md
          git commit -m "feat(llm): use ChatGPT subscription through Codex OAuth"
          git push origin HEAD:feature/meetodds-openai-cloud

      - name: Validate Codex parser and auth helpers
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          : > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          WHISPER_DONT_GENERATE_BINDINGS=1 cargo test -q -p meetily openai_codex --lib

      - name: Frozen frontend install and production build
        working-directory: frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Linux dependencies for native check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf >/dev/null

      - name: Full native Rust compile check
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          : > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          WHISPER_DONT_GENERATE_BINDINGS=1 cargo check -q -p meetily --lib --message-format short

      - name: Verify subscription and API providers stay distinct
        run: |
          set -euo pipefail
          grep -q 'OpenAI Codex (ChatGPT subscription)' frontend/src/components/ModelSettingsModal.tsx
          grep -q 'OpenAI Cloud API' frontend/src/components/ModelSettingsModal.tsx
          grep -q 'openai-codex' frontend/src-tauri/src/summary/llm_client.rs
          grep -q 'chatgpt.com/backend-api/codex' frontend/src-tauri/src/openai_codex.rs
          grep -q 'deviceauth/usercode' frontend/src-tauri/src/openai_codex.rs
          grep -q 'oauth/token' frontend/src-tauri/src/openai_codex.rs
          grep -q 'store": false' frontend/src-tauri/src/openai_codex.rs
          grep -q 'does \*\*not\*\* import `~/.codex/auth.json`' docs/OPENAI_CLOUD.md
          grep -q '"identifier": "com.meetily.ai"' frontend/src-tauri/tauri.conf.json

      - name: Remove one-time Codex validation workflow
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/meetodds-codex-oauth.yml
          git commit -m "chore(ci): remove Codex OAuth validation harness"
          git push origin HEAD:feature/meetodds-openai-cloud
