name: Streaming transcript frontend checkpoint v3

on:
  push:
    branches: [feature/streaming-live-transcripts]
    paths:
      - .github/workflows/streaming-live-transcripts-frontend-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/streaming-live-transcripts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply frontend milestone
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/streaming-live-transcripts
          git merge --no-edit origin/main
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/scripts/implement_streaming_live_subtitles.py')
          text = p.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old in text:\n        return text.replace(old, new, 1)\n    if new in text:\n        return text\n    raise SystemExit(f"Missing anchor for {label}: {old[:180]!r}")\n'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old in text:\n        return text.replace(old, new, 1)\n    if new in text:\n        return text\n    def indented(value: str, prefix: str) -> str:\n        return "\\n".join(prefix + line if line else line for line in value.split("\\n"))\n    for width in range(1, 41):\n        prefix = " " * width\n        candidate = indented(old, prefix)\n        if candidate in text:\n            return text.replace(candidate, indented(new, prefix), 1)\n    raise SystemExit(f"Missing anchor for {label}: {old[:180]!r}")\n'''
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
          python3 frontend/scripts/patch_streaming_frontend_timer.py
          python3 frontend/scripts/implement_streaming_live_subtitles.py frontend
          git add \
            frontend/src/types/index.ts \
            frontend/src/contexts/TranscriptContext.tsx \
            frontend/src/components/LiveTranscriptSubtitle.tsx \
            frontend/src/hooks/useLiveTranslation.ts \
            frontend/src/app/_components/TranscriptPanel.tsx
          git commit -m "feat(transcript): render ephemeral live subtitles during speech"
          git push origin HEAD:feature/streaming-live-transcripts
      - name: Remove frontend checkpoint workflows
        run: |
          git rm \
            .github/workflows/streaming-live-transcripts-frontend.yml \
            .github/workflows/streaming-live-transcripts-frontend-v2.yml \
            .github/workflows/streaming-live-transcripts-frontend-v3.yml
          git commit -m "chore(ci): remove subtitle frontend checkpoint harnesses"
          git push origin HEAD:feature/streaming-live-transcripts
