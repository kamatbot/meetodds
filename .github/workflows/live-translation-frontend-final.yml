name: Finalize live translation frontend latency

on:
  push:
    branches: [feature/live-translation]
    paths:
      - .github/workflows/live-translation-frontend-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out live translation branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-translation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git and sync current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/live-translation
          git merge --no-edit origin/feature/live-translation
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD

      - name: Prioritize newest captions and restore settings after hydration
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"Missing anchor in {path}: {old[:200]!r}")

          hook = 'frontend/src/hooks/useLiveTranslation.ts'
          replace_once(
              hook,
              'const BACKFILL_SEGMENT_LIMIT = 24;',
              'const BACKFILL_SEGMENT_LIMIT = 8;',
          )
          replace_once(
              hook,
              '''  const [settings, setSettings] = useState<LiveTranslationSettings>(() =>\n    typeof window === 'undefined'\n      ? DEFAULT_LIVE_TRANSLATION_SETTINGS\n      : loadLiveTranslationSettings()\n  );''',
              '''  const [settings, setSettings] = useState<LiveTranslationSettings>(\n    DEFAULT_LIVE_TRANSLATION_SETTINGS\n  );''',
          )
          replace_once(
              hook,
              '''  useEffect(() => {\n    mountedRef.current = true;\n    return () => {''',
              '''  useEffect(() => {\n    mountedRef.current = true;\n    setSettings(loadLiveTranslationSettings());\n    return () => {''',
          )
          replace_once(
              hook,
              '''    if (job.isPartial) {\n      queueRef.current.push(job);\n    } else {\n      const firstPartialIndex = queueRef.current.findIndex((queued) => queued.isPartial);\n      if (firstPartialIndex >= 0) {\n        queueRef.current.splice(firstPartialIndex, 0, job);\n      } else {\n        queueRef.current.push(job);\n      }\n    }''',
              '''    if (job.isPartial) {\n      queueRef.current.push(job);\n    } else {\n      // Current finalized speech must beat historical catch-up work. Older\n      // final turns remain queued and are translated after the live edge.\n      queueRef.current.unshift(job);\n    }''',
          )
          replace_once(
              hook,
              '''    const candidates = transcripts.slice(-BACKFILL_SEGMENT_LIMIT);''',
              '''    // Start at the live edge. This lets the current speaker occupy the\n    // available workers before optional recent-history catch-up begins.\n    const candidates = transcripts.slice(-BACKFILL_SEGMENT_LIMIT).reverse();''',
          )
          replace_once(
              hook,
              '''          if (!cached) {\n            resultCacheRef.current.set(cacheKey, response);\n            trimResultCache(resultCacheRef.current);\n          }\n\n          if (!isCurrentJob(job)) return;''',
              '''          if (!cached) {\n            resultCacheRef.current.set(cacheKey, response);\n            trimResultCache(resultCacheRef.current);\n          }\n\n          const latencyMs = cached ? 0 : response.latencyMs;\n          if (!isCurrentJob(job)) return;''',
          )
          replace_once(
              hook,
              '''              latencyMs: response.latencyMs,''',
              '''              latencyMs,''',
          )
          replace_once(
              hook,
              '''          setLastLatencyMs(response.latencyMs);''',
              '''          setLastLatencyMs(latencyMs);''',
          )

          docs = 'docs/LIVE_TRANSLATION.md'
          replace_once(
              docs,
              '''- Final transcript turns enter the queue immediately.\n- Partial turns wait for a short debounce window so rapidly changing fragments do not create a request storm.''',
              '''- Final transcript turns enter the queue immediately.\n- When enabled mid-meeting, only the eight most recent turns are considered and the newest finalized speech is processed first.\n- Partial turns wait for a short debounce window so rapidly changing fragments do not create a request storm.''',
          )
          PY

          git add frontend/src/hooks/useLiveTranslation.ts docs/LIVE_TRANSLATION.md
          git commit -m "perf(translation): prioritize the live edge over catch-up work"
          git fetch origin main feature/live-translation
          git merge --no-edit origin/feature/live-translation
          git merge --no-edit origin/main
          git push origin HEAD:feature/live-translation

      - name: Frozen frontend production build
        working-directory: frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify live-edge scheduling invariants
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          grep -q 'BACKFILL_SEGMENT_LIMIT = 8' frontend/src/hooks/useLiveTranslation.ts
          grep -q 'queueRef.current.unshift(job)' frontend/src/hooks/useLiveTranslation.ts
          grep -q 'slice(-BACKFILL_SEGMENT_LIMIT).reverse()' frontend/src/hooks/useLiveTranslation.ts
          grep -q 'setSettings(loadLiveTranslationSettings())' frontend/src/hooks/useLiveTranslation.ts
          grep -q 'const latencyMs = cached ? 0' frontend/src/hooks/useLiveTranslation.ts

      - name: Remove one-time frontend validation workflow
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/live-translation-frontend-final.yml
          git commit -m "chore(ci): remove live translation frontend harness"
          git push origin HEAD:feature/live-translation
