name: Harden and validate live translation latency

on:
  push:
    branches: [feature/live-translation]
    paths:
      - .github/workflows/live-translation-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out live translation branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-translation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git and sync current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/live-translation
          git merge --no-edit origin/feature/live-translation
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD

      - name: Reuse cloud connections and protect local inference headroom
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"Missing anchor in {path}: {old[:200]!r}")

          rust = 'frontend/src-tauri/src/live_translation.rs'
          replace_once(
              rust,
              '''static TRANSLATION_SEMAPHORE: Lazy<Semaphore> = Lazy::new(|| Semaphore::new(2));\nstatic ACTIVE_TRANSLATIONS:''',
              '''static CLOUD_TRANSLATION_SEMAPHORE: Lazy<Semaphore> = Lazy::new(|| Semaphore::new(2));\nstatic LOCAL_TRANSLATION_SEMAPHORE: Lazy<Semaphore> = Lazy::new(|| Semaphore::new(1));\nstatic TRANSLATION_HTTP_CLIENT: Lazy<reqwest::Client> = Lazy::new(reqwest::Client::new);\nstatic ACTIVE_TRANSLATIONS:''',
          )
          replace_once(
              rust,
              '''fn cache_key(\n    provider: &str,''',
              '''fn uses_local_translation_worker(provider: &LLMProvider) -> bool {\n    matches!(provider, LLMProvider::Ollama | LLMProvider::BuiltInAI)\n}\n\nfn cache_key(\n    provider: &str,''',
          )
          replace_once(
              rust,
              '''    let permit = tokio::select! {\n        permit = TRANSLATION_SEMAPHORE.acquire() => {''',
              '''    // Cloud requests get limited parallelism and reuse pooled HTTP connections.\n    // Local generation stays single-flight so it cannot steal the CPU/GPU budget\n    // reserved for live Whisper/Parakeet transcription on Apple Silicon.\n    let worker_pool = if uses_local_translation_worker(&config.provider) {\n        &*LOCAL_TRANSLATION_SEMAPHORE\n    } else {\n        &*CLOUD_TRANSLATION_SEMAPHORE\n    };\n\n    let permit = tokio::select! {\n        permit = worker_pool.acquire() => {''',
          )
          replace_once(
              rust,
              '''    let client = reqwest::Client::new();\n    let translation_future = generate_summary(\n        &client,''',
              '''    let translation_future = generate_summary(\n        &TRANSLATION_HTTP_CLIENT,''',
          )
          replace_once(
              rust,
              '''    #[test]\n    fn cleans_common_wrappers() {''',
              '''    #[test]\n    fn local_providers_are_single_flight() {\n        assert!(uses_local_translation_worker(&LLMProvider::Ollama));\n        assert!(uses_local_translation_worker(&LLMProvider::BuiltInAI));\n        assert!(!uses_local_translation_worker(&LLMProvider::OpenAICodex));\n        assert!(!uses_local_translation_worker(&LLMProvider::OpenAI));\n    }\n\n    #[test]\n    fn cleans_common_wrappers() {''',
          )

          hook = 'frontend/src/hooks/useLiveTranslation.ts'
          replace_once(
              hook,
              '''      setTranslations((previous) => ({\n        ...previous,\n        [job.segmentKey]: {\n          ...(previous[job.segmentKey] ?? {}),\n          segmentKey: job.segmentKey,\n          sourceText: job.text,\n          targetLanguage: job.targetLanguage,\n          status: 'translating',\n          error: undefined,\n        },\n      }));''',
              '''      setTranslations((previous) => {\n        const previousEntry = previous[job.segmentKey];\n        const sourceMatches =\n          previousEntry?.sourceText === job.text &&\n          previousEntry?.targetLanguage === job.targetLanguage;\n\n        return {\n          ...previous,\n          [job.segmentKey]: {\n            segmentKey: job.segmentKey,\n            sourceText: job.text,\n            targetLanguage: job.targetLanguage,\n            status: 'translating',\n            translatedText: sourceMatches ? previousEntry?.translatedText : undefined,\n            provider: sourceMatches ? previousEntry?.provider : undefined,\n            model: sourceMatches ? previousEntry?.model : undefined,\n            latencyMs: sourceMatches ? previousEntry?.latencyMs : undefined,\n            cached: sourceMatches ? previousEntry?.cached : undefined,\n          },\n        };\n      });''',
          )
          replace_once(
              hook,
              '''      setTranslations((previous) => ({\n        ...previous,\n        [segmentKey]: {\n          ...(previous[segmentKey] ?? {}),\n          segmentKey,\n          sourceText: text,\n          targetLanguage: settings.targetLanguage,\n          status: 'queued',\n          error: undefined,\n        },\n      }));''',
              '''      setTranslations((previous) => {\n        const previousEntry = previous[segmentKey];\n        const sourceMatches =\n          previousEntry?.sourceText === text &&\n          previousEntry?.targetLanguage === settings.targetLanguage;\n\n        return {\n          ...previous,\n          [segmentKey]: {\n            segmentKey,\n            sourceText: text,\n            targetLanguage: settings.targetLanguage,\n            status: 'queued',\n            translatedText: sourceMatches ? previousEntry?.translatedText : undefined,\n            provider: sourceMatches ? previousEntry?.provider : undefined,\n            model: sourceMatches ? previousEntry?.model : undefined,\n            latencyMs: sourceMatches ? previousEntry?.latencyMs : undefined,\n            cached: sourceMatches ? previousEntry?.cached : undefined,\n          },\n        };\n      });''',
          )
          PY

          rustfmt --edition 2021 frontend/src-tauri/src/live_translation.rs
          git add frontend/src-tauri/src/live_translation.rs frontend/src/hooks/useLiveTranslation.ts
          git commit -m "perf(translation): reuse connections and protect local transcription"
          git fetch origin main feature/live-translation
          git merge --no-edit origin/feature/live-translation
          git merge --no-edit origin/main
          git push origin HEAD:feature/live-translation

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config \
            libglib2.0-dev libasound2-dev libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf >/dev/null

      - name: Provide Tauri helper placeholder
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          : > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Test native translation helpers
        env:
          WHISPER_DONT_GENERATE_BINDINGS: "1"
        run: cargo test -q -p meetily live_translation --lib

      - name: Frozen frontend production build
        working-directory: frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Full native Rust compile check
        env:
          WHISPER_DONT_GENERATE_BINDINGS: "1"
          CARGO_TERM_COLOR: never
        run: cargo check -q -p meetily --lib --message-format short

      - name: Verify hardening invariants
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          grep -q 'CLOUD_TRANSLATION_SEMAPHORE.*Semaphore::new(2)' frontend/src-tauri/src/live_translation.rs
          grep -q 'LOCAL_TRANSLATION_SEMAPHORE.*Semaphore::new(1)' frontend/src-tauri/src/live_translation.rs
          grep -q 'TRANSLATION_HTTP_CLIENT' frontend/src-tauri/src/live_translation.rs
          grep -q 'uses_local_translation_worker' frontend/src-tauri/src/live_translation.rs
          grep -q 'const sourceMatches' frontend/src/hooks/useLiveTranslation.ts
          test "$(grep -c 'const sourceMatches' frontend/src/hooks/useLiveTranslation.ts)" -eq 2

      - name: Remove one-time hardening workflow
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/live-translation-hardening.yml
          git commit -m "chore(ci): remove live translation hardening harness"
          git push origin HEAD:feature/live-translation
