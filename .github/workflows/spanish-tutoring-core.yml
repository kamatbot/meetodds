name: Spanish tutoring core
on:
  push:
    branches: [feat/spanish-tutoring-engine]
    paths:
      - 'frontend/src-tauri/src/spanish/**'
      - 'tools/spanish-core-tests/**'
      - '.github/workflows/spanish-tutoring-core.yml'
  pull_request:
    paths:
      - 'frontend/src-tauri/src/spanish/**'
      - 'tools/spanish-core-tests/**'
      - '.github/workflows/spanish-tutoring-core.yml'
permissions:
  contents: read
concurrency:
  group: spanish-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Unit and deterministic async tests
        run: cargo +stable test --manifest-path tools/spanish-core-tests/Cargo.toml
      - name: Check golden corpus
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('frontend/src-tauri/src/spanish/golden.jsonl')
          if path.exists():
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              assert len(rows) >= 40
              assert len({r['id'] for r in rows}) == len(rows)
              print(f'{len(rows)} well-formed, uniquely identified golden cases')
          PY
