name: Implement and validate MeetOdds OpenAI cloud option

on:
  push:
    branches: [feature/meetodds-openai-cloud]
    paths:
      - .github/workflows/meetodds-openai-cloud.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/meetodds-openai-cloud
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add first-class OpenAI cloud configuration
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"Missing anchor in {path}: {old[:120]!r}")

          modal = Path('frontend/src/components/ModelSettingsModal.tsx')
          text = modal.read_text()

          old_fallback = """const OPENAI_FALLBACK_MODELS = [\n  'gpt-4o',\n  'gpt-4o-mini',\n  'gpt-4-turbo',\n  'gpt-4',\n  'gpt-3.5-turbo',\n  'o1',\n  'o1-mini',\n  'o3',\n  'o3-mini',\n];"""
          new_fallback = """const OPENAI_FALLBACK_MODELS = [\n  'gpt-5.6-terra',\n  'gpt-5.6',\n  'gpt-5.6-luna',\n  'gpt-5.5',\n  'gpt-5.4',\n  'gpt-4.1',\n  'gpt-4o',\n];"""
          if old_fallback in text:
              text = text.replace(old_fallback, new_fallback, 1)
          elif new_fallback not in text:
              raise SystemExit('OpenAI fallback model anchor changed')

          text = text.replace(
              '<SelectItem value="openai">OpenAI</SelectItem>',
              '<SelectItem value="openai">OpenAI Cloud API</SelectItem>',
              1,
          )

          alert = """        {modelConfig.provider === 'openai' && (\n          <Alert className=\"border-blue-200 bg-blue-50\">\n            <AlertDescription className=\"space-y-2 text-sm text-blue-950\">\n              <p>\n                <strong>OpenAI Cloud</strong> sends summary requests to OpenAI using the API key you provide.\n                ChatGPT Plus/Pro subscriptions and OpenAI API billing are separate.\n              </p>\n              <p className=\"text-xs text-blue-800\">\n                OpenAI's \"Sign in with ChatGPT\" is an identity sign-in and does not grant third-party apps\n                ChatGPT subscription usage for API calls, so MeetOdds does not offer a misleading OAuth button.\n              </p>\n              <Button\n                type=\"button\"\n                variant=\"link\"\n                size=\"sm\"\n                className=\"h-auto p-0 text-blue-700\"\n                onClick={() => invoke('open_external_url', { url: 'https://platform.openai.com/api-keys' })}\n              >\n                Create or manage an OpenAI API key\n                <ExternalLink className=\"ml-1 h-3.5 w-3.5\" />\n              </Button>\n            </AlertDescription>\n          </Alert>\n        )}\n\n"""
          anchor = '        {/* Custom OpenAI Configuration Section */}'
          if alert not in text:
              if anchor not in text:
                  raise SystemExit('Custom OpenAI section anchor changed')
              text = text.replace(anchor, alert + anchor, 1)

          text = text.replace(
              '            <Label>API Key</Label>',
              "            <Label>{modelConfig.provider === 'openai' ? 'OpenAI API Key' : 'API Key'}</Label>",
              1,
          )
          text = text.replace(
              '                placeholder="Enter your API key"',
              "                placeholder={modelConfig.provider === 'openai' ? 'sk-…' : 'Enter your API key'}",
              1,
          )
          modal.write_text(text)

          # Keep backend fallback models current. Dynamic /v1/models discovery remains authoritative.
          openai = Path('frontend/src-tauri/src/openai/openai.rs')
          text = openai.read_text()
          pattern = re.compile(r'const FALLBACK_MODELS: &\[&str\] = &\[.*?\n\];', re.S)
          replacement = '''const FALLBACK_MODELS: &[&str] = &[\n    "gpt-5.6-terra",\n    "gpt-5.6",\n    "gpt-5.6-luna",\n    "gpt-5.5",\n    "gpt-5.4",\n    "gpt-4.1",\n    "gpt-4o",\n];'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1 and replacement not in text:
              raise SystemExit('Backend OpenAI fallback model anchor changed')
          openai.write_text(updated if count == 1 else text)

          # Complete visible desktop branding without changing the legacy bundle identifier/database identity.
          tray = Path('frontend/src-tauri/src/tray.rs')
          replace_once(tray, '.tooltip("Meetily")', '.tooltip("MeetOdds")')

          transcript_view = Path('frontend/src/components/VirtualizedTranscriptView.tsx')
          if transcript_view.exists():
              t = transcript_view.read_text()
              t = t.replace('Welcome to meetily!', 'Welcome to MeetOdds!')
              transcript_view.write_text(t)

          docs = Path('docs/OPENAI_CLOUD.md')
          docs.write_text('''# OpenAI Cloud in MeetOdds\n\nMeetOdds supports OpenAI as an optional cloud summarization provider. Recording and transcription can remain local; when OpenAI is selected, the transcript content needed for the summary request is sent to the OpenAI API.\n\n## Authentication\n\nMeetOdds uses the supported OpenAI API authentication mechanism: an OpenAI API key sent as a Bearer token from the native Tauri backend. The key is stored through MeetOdds' existing provider-key settings path and is not exposed in the rendered transcript UI.\n\n## Why there is no “Use my ChatGPT subscription” OAuth button\n\nAs of September 2, 2026, OpenAI documents ChatGPT and API billing as separate systems. “Sign in with ChatGPT” is an identity-provider login for participating applications; it does not independently grant an external application access to ChatGPT subscription usage or API entitlement. Codex is a product-specific exception that OpenAI explicitly supports with ChatGPT-plan sign-in.\n\nMeetOdds therefore does not imitate Codex OAuth or capture ChatGPT session tokens. Doing so would be unsupported, brittle, and misleading.\n\n## Setup\n\n1. Open **Settings → Model Settings**.\n2. Select **OpenAI Cloud API**.\n3. Use the link in MeetOdds to create/manage an OpenAI API key.\n4. Paste the key, choose a model, and save.\n\nThe preferred summary model is `gpt-5.6-terra` for a strong quality/cost balance. `gpt-5.6` and `gpt-5.6-luna` are also offered as fallbacks; the app dynamically loads the models available to the supplied API key.\n\n## Compatibility note\n\nThe visible product name is MeetOdds, but the existing `com.meetily.ai` Tauri identifier and internal Rust package name are intentionally retained so upgrades continue to use the same application data, settings, database, and recordings.\n''')
          PY

          rustfmt --edition 2021 frontend/src-tauri/src/openai/openai.rs frontend/src-tauri/src/tray.rs

          git add frontend/src/components/ModelSettingsModal.tsx \
                  frontend/src/components/VirtualizedTranscriptView.tsx \
                  frontend/src-tauri/src/openai/openai.rs \
                  frontend/src-tauri/src/tray.rs \
                  docs/OPENAI_CLOUD.md
          git commit -m "feat(llm): make OpenAI cloud a first-class MeetOdds provider"
          git push origin HEAD:feature/meetodds-openai-cloud

      - name: Report remaining legacy visible branding
        run: |
          echo "Remaining Meetily references in frontend source (reviewed for compatibility/upstream attribution):"
          grep -RniE 'Meetily|meetily' frontend/src --include='*.ts' --include='*.tsx' || true

      - name: Frozen frontend install and production build
        working-directory: frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Linux dependencies for Tauri check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf >/dev/null

      - name: Compile-check native library
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          : > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          WHISPER_DONT_GENERATE_BINDINGS=1 cargo check -q -p meetily --lib --message-format short

      - name: Verify branding and OpenAI guardrails
        run: |
          set -euo pipefail
          grep -q '"productName": "MeetOdds"' frontend/src-tauri/tauri.conf.json
          grep -q '"title": "MeetOdds"' frontend/src-tauri/tauri.conf.json
          grep -q '"identifier": "com.meetily.ai"' frontend/src-tauri/tauri.conf.json
          grep -q 'OpenAI Cloud API' frontend/src/components/ModelSettingsModal.tsx
          grep -q 'ChatGPT Plus/Pro subscriptions and OpenAI API billing are separate' frontend/src/components/ModelSettingsModal.tsx
          grep -q 'gpt-5.6-terra' frontend/src-tauri/src/openai/openai.rs
          grep -q 'Why there is no' docs/OPENAI_CLOUD.md
          ! grep -q 'oauth.*chatgpt\|chatgpt.*oauth' frontend/src-tauri/src/summary/llm_client.rs

      - name: Remove one-time validation workflow
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/meetodds-openai-cloud.yml
          git commit -m "chore(ci): remove MeetOdds migration harness"
          git push origin HEAD:feature/meetodds-openai-cloud
