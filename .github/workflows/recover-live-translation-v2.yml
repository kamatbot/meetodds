name: Recover live translation v2

on:
  push:
    branches: [feature/live-translation-v2]
    paths:
      - .github/workflows/recover-live-translation-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-translation-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main and apply recovered source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/live-translation-v2
          git merge --no-edit origin/main
          python3 frontend/scripts/recover_live_translation_v2.py
          git add \
            frontend/src-tauri/src/live_translation.rs \
            frontend/src-tauri/src/lib.rs \
            frontend/src/lib/live-translation.ts \
            frontend/src/hooks/useLiveTranslation.ts \
            frontend/src/components/LiveTranslationControl.tsx \
            frontend/src/app/_components/TranscriptPanel.tsx \
            frontend/src/components/VirtualizedTranscriptView.tsx \
            docs/LIVE_TRANSLATION_V2.md
          git commit -m "feat(translation): recover adaptive live translation v2"
          git push origin HEAD:feature/live-translation-v2

      - name: Remove recovery helpers
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/recover-live-translation-v2.yml \
            frontend/scripts/recover_live_translation_v2.py
          git commit -m "chore(recovery): remove live translation v2 recovery helpers"
          git push origin HEAD:feature/live-translation-v2
