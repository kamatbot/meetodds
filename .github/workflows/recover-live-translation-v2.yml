name: Recover live translation v2

on:
  push:
    branches: [feature/live-translation-v2]
    paths:
      - .github/workflows/recover-live-translation-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-translation-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/live-translation-v2
          git merge --no-edit origin/main

      - name: Recover adaptive provider routing and first-word failover
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src-tauri/src/live_translation.rs')
          text = path.read_text()

          def once(old: str, new: str):
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing anchor: {old[:160]!r}')

          def regex_once(pattern: str, replacement: str):
              global text
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count == 1:
                  text = updated
              elif replacement not in text:
                  raise SystemExit(f'missing regex anchor: {pattern[:160]!r}')

          once(
              'const DELTA_EMIT_INTERVAL: Duration = Duration::from_millis(40);\n',
              '''const DELTA_EMIT_INTERVAL: Duration = Duration::from_millis(40);\nconst FAST_GROQ_MODEL: &str = "llama-3.1-8b-instant";\nconst FAST_OPENAI_MODEL: &str = "gpt-4o-mini";\nconst FAST_CLAUDE_MODEL: &str = "claude-haiku-4-5-20251001";\nconst PROVIDER_COOLDOWN: Duration = Duration::from_secs(45);\n'''
          )
          once(
              'static TRANSLATION_HTTP_CLIENT: Lazy<reqwest::Client> = Lazy::new(reqwest::Client::new);',
              '''static TRANSLATION_HTTP_CLIENT: Lazy<reqwest::Client> = Lazy::new(|| {\n    reqwest::Client::builder()\n        .connect_timeout(Duration::from_secs(3))\n        .pool_idle_timeout(Duration::from_secs(90))\n        .tcp_nodelay(true)\n        .build()\n        .unwrap_or_else(|_| reqwest::Client::new())\n});'''
          )
          once(
              'static TRANSLATION_CACHE: Lazy<Mutex<TranslationCache>> =\n    Lazy::new(|| Mutex::new(TranslationCache::default()));',
              '''static TRANSLATION_CACHE: Lazy<Mutex<TranslationCache>> =\n    Lazy::new(|| Mutex::new(TranslationCache::default()));\nstatic PROVIDER_HEALTH: Lazy<Mutex<HashMap<String, ProviderHealth>>> =\n    Lazy::new(|| Mutex::new(HashMap::new()));'''
          )

          once(
              '''#[derive(Debug, Clone)]\nstruct ActiveTranslation {''',
              '''#[derive(Debug, Clone, Default)]\nstruct ProviderHealth {\n    consecutive_failures: u32,\n    average_first_word_ms: Option<u64>,\n    cooldown_until: Option<Instant>,\n}\n\n#[derive(Debug, Clone, Copy)]\nstruct TranslationBudgets {\n    first_word: Duration,\n    attempt: Duration,\n    total: Duration,\n}\n\n#[derive(Debug, Clone)]\nstruct ActiveTranslation {'''
          )

          regex_once(
              r'#\[derive\(Debug, Clone, Serialize\)\]\n#\[serde\(rename_all = "camelCase"\)\]\npub struct LiveTranslationResponse \{.*?\n\}',
              '''#[derive(Debug, Clone, Serialize)]\n#[serde(rename_all = "camelCase")]\npub struct LiveTranslationResponse {\n    pub request_id: String,\n    pub translated_text: String,\n    pub source_language: Option<String>,\n    pub target_language: String,\n    pub provider: String,\n    pub model: String,\n    pub latency_ms: u64,\n    pub first_word_latency_ms: u64,\n    pub fallback_reason: Option<String>,\n    pub cached: bool,\n}'''
          )
          once('struct TranslationProviderConfig {', '#[derive(Clone)]\nstruct TranslationProviderConfig {')

          regex_once(
              r'fn build_translation_prompts\(.*?\n\}',
              '''fn build_translation_prompts(\n    text: &str,\n    source_language: Option<LanguageSpec>,\n    target_language: LanguageSpec,\n    context_text: Option<&str>,\n    glossary: Option<&str>,\n    context_hint: Option<&str>,\n) -> (String, String) {\n    let source = source_language\n        .map(|language| language.name.to_string())\n        .unwrap_or_else(|| "the automatically detected source language".to_string());\n\n    let mut system_prompt = format!(\n        "You are a simultaneous interpreter for a live business meeting. Translate from {source} to {}. \\\nReturn ONLY the translation of the CURRENT UTTERANCE. Never repeat the reference context. \\\nPrefer natural spoken language over literal word-for-word phrasing. Preserve names, product terms, numbers, dates, URLs, and intent. \\\nTranslate short turns such as Yes, No, Agreed, and interruptions; do not invent missing speech. \\\nIf the current utterance is already in {}, return it unchanged.",\n        target_language.name, target_language.name\n    );\n\n    if let Some(hint) = context_hint.map(str::trim).filter(|value| !value.is_empty()) {\n        system_prompt.push_str("\\nMeeting context: ");\n        system_prompt.push_str(hint);\n    }\n    if let Some(terms) = glossary.map(str::trim).filter(|value| !value.is_empty()) {\n        system_prompt.push_str("\\nTerminology / names to preserve consistently: ");\n        system_prompt.push_str(terms);\n    }\n    if let Some(context) = context_text.map(str::trim).filter(|value| !value.is_empty()) {\n        system_prompt.push_str("\\nReference-only previous turns (DO NOT translate or output these):\\n");\n        system_prompt.push_str(context);\n    }\n\n    (system_prompt, text.to_string())\n}'''
          )

          regex_once(
              r'/// Read a server-sent-event body\..*?\nasync fn stream_sse\(.*?\n\}',
              '''/// Read a server-sent-event body while enforcing a time-to-first-text budget.\nasync fn stream_sse(\n    response: reqwest::Response,\n    mut extract: impl FnMut(&Value) -> Result<Option<String>, String>,\n    mut on_text: impl FnMut(&str, u64),\n    attempt_started: Instant,\n    first_word_budget: Duration,\n) -> Result<(String, u64), String> {\n    let mut stream = response.bytes_stream();\n    let mut buffer: Vec<u8> = Vec::new();\n    let mut text = String::new();\n    let mut first_word_ms: Option<u64> = None;\n\n    loop {\n        let next_chunk = if first_word_ms.is_none() {\n            let Some(remaining) = first_word_budget.checked_sub(attempt_started.elapsed()) else {\n                return Err(format!("first translated word exceeded {}ms", first_word_budget.as_millis()));\n            };\n            timeout(remaining, stream.next())\n                .await\n                .map_err(|_| format!("first translated word exceeded {}ms", first_word_budget.as_millis()))?\n        } else {\n            stream.next().await\n        };\n\n        let Some(chunk) = next_chunk else { break };\n        let chunk = chunk.map_err(|error| format!("Translation stream failed: {error}"))?;\n        buffer.extend_from_slice(&chunk);\n        while let Some(newline) = buffer.iter().position(|byte| *byte == b'\\n') {\n            let line: Vec<u8> = buffer.drain(..=newline).collect();\n            let line = String::from_utf8_lossy(&line);\n            let Some(data) = line.trim().strip_prefix("data:") else { continue };\n            let data = data.trim();\n            if data.is_empty() || data == "[DONE]" { continue; }\n            let Ok(event) = serde_json::from_str::<Value>(data) else { continue };\n            if let Some(delta) = extract(&event)? {\n                if !delta.is_empty() {\n                    text.push_str(&delta);\n                    let first = *first_word_ms.get_or_insert_with(|| {\n                        attempt_started.elapsed().as_millis().min(u64::MAX as u128) as u64\n                    });\n                    on_text(&text, first);\n                }\n            }\n        }\n    }\n\n    if text.trim().is_empty() {\n        return Err("translation stream ended before producing text".to_string());\n    }\n    Ok((text, first_word_ms.unwrap_or_else(|| attempt_started.elapsed().as_millis() as u64)))\n}'''
          )

          regex_once(
              r'fn cache_key\(.*?\n\}',
              '''fn cache_key(\n    provider: &str,\n    model: &str,\n    source_language: Option<LanguageSpec>,\n    target_language: LanguageSpec,\n    text: &str,\n    context_text: Option<&str>,\n    glossary: Option<&str>,\n    context_hint: Option<&str>,\n) -> String {\n    let mut hasher = DefaultHasher::new();\n    provider.hash(&mut hasher);\n    model.hash(&mut hasher);\n    source_language.map(|language| language.code).hash(&mut hasher);\n    target_language.code.hash(&mut hasher);\n    text.hash(&mut hasher);\n    context_text.unwrap_or_default().hash(&mut hasher);\n    glossary.unwrap_or_default().hash(&mut hasher);\n    context_hint.unwrap_or_default().hash(&mut hasher);\n    format!("{:016x}", hasher.finish())\n}'''
          )

          insert_anchor = 'async fn register_translation(request_id: &str) -> (u64, CancellationToken) {'
          helpers = r'''fn translation_budgets(speed: Option<&str>) -> TranslationBudgets {
    match speed.unwrap_or("instant").trim().to_ascii_lowercase().as_str() {
        "accurate" => TranslationBudgets {
            first_word: Duration::from_secs(10),
            attempt: Duration::from_secs(30),
            total: Duration::from_secs(32),
        },
        "balanced" => TranslationBudgets {
            first_word: Duration::from_millis(3200),
            attempt: Duration::from_secs(15),
            total: Duration::from_secs(22),
        },
        _ => TranslationBudgets {
            first_word: Duration::from_millis(1800),
            attempt: Duration::from_secs(8),
            total: Duration::from_secs(12),
        },
    }
}

fn fast_default_model(provider: &str) -> Option<&'static str> {
    match provider {
        "groq" => Some(FAST_GROQ_MODEL),
        "openai" => Some(FAST_OPENAI_MODEL),
        "claude" => Some(FAST_CLAUDE_MODEL),
        _ => None,
    }
}

fn provider_health_key(config: &TranslationProviderConfig) -> String {
    format!("{}:{}", config.provider_name, config.model_name)
}

async fn provider_is_cooling_down(config: &TranslationProviderConfig) -> bool {
    let key = provider_health_key(config);
    PROVIDER_HEALTH
        .lock()
        .await
        .get(&key)
        .and_then(|health| health.cooldown_until)
        .is_some_and(|until| until > Instant::now())
}

async fn record_provider_success(config: &TranslationProviderConfig, first_word_ms: u64) {
    let key = provider_health_key(config);
    let mut health = PROVIDER_HEALTH.lock().await;
    let entry = health.entry(key).or_default();
    entry.consecutive_failures = 0;
    entry.cooldown_until = None;
    entry.average_first_word_ms = Some(match entry.average_first_word_ms {
        Some(previous) => ((previous as f64 * 0.7) + (first_word_ms as f64 * 0.3)) as u64,
        None => first_word_ms,
    });
}

async fn record_provider_failure(config: &TranslationProviderConfig) {
    let key = provider_health_key(config);
    let mut health = PROVIDER_HEALTH.lock().await;
    let entry = health.entry(key).or_default();
    entry.consecutive_failures = entry.consecutive_failures.saturating_add(1);
    if entry.consecutive_failures >= 2 {
        entry.cooldown_until = Some(Instant::now() + PROVIDER_COOLDOWN);
    }
}

async fn resolve_fast_cloud_candidate(
    pool: &SqlitePool,
    provider_name: &str,
    model_override: Option<&str>,
) -> Result<Option<TranslationProviderConfig>, String> {
    let Some(api_key) = SettingsRepository::get_api_key(pool, provider_name)
        .await
        .map_err(|error| format!("Failed to load {provider_name} API key: {error}"))?
        .filter(|key| !key.trim().is_empty())
    else {
        return Ok(None);
    };

    let provider = LLMProvider::from_str(provider_name)?;
    let model_name = model_override
        .map(str::trim)
        .filter(|value| !value.is_empty())
        .map(str::to_string)
        .or_else(|| fast_default_model(provider_name).map(str::to_string))
        .ok_or_else(|| format!("No fast translation model is configured for {provider_name}"))?;

    Ok(Some(TranslationProviderConfig {
        provider,
        provider_name: provider_name.to_string(),
        model_name,
        api_key,
        ollama_endpoint: None,
        custom_openai_endpoint: None,
        max_tokens: None,
        temperature: None,
        top_p: None,
    }))
}

fn push_unique_candidate(
    candidates: &mut Vec<TranslationProviderConfig>,
    candidate: TranslationProviderConfig,
) {
    if candidates.iter().any(|existing| {
        existing.provider_name == candidate.provider_name && existing.model_name == candidate.model_name
    }) {
        return;
    }
    candidates.push(candidate);
}

async fn resolve_provider_candidates(
    pool: &SqlitePool,
    translation_engine: Option<&str>,
    model_override: Option<&str>,
) -> Result<Vec<TranslationProviderConfig>, String> {
    let engine = translation_engine
        .map(str::trim)
        .filter(|value| !value.is_empty())
        .unwrap_or("auto")
        .to_ascii_lowercase();
    let mut candidates = Vec::new();

    if engine == "auto" {
        for provider in ["groq", "openai", "claude"] {
            if let Some(candidate) = resolve_fast_cloud_candidate(pool, provider, None).await? {
                push_unique_candidate(&mut candidates, candidate);
            }
        }
        if let Ok(current) = resolve_provider_config(pool).await {
            push_unique_candidate(&mut candidates, current);
        }
    } else if engine == "summary" {
        let mut current = resolve_provider_config(pool).await?;
        if let Some(model) = model_override.map(str::trim).filter(|value| !value.is_empty()) {
            current.model_name = model.to_string();
        }
        push_unique_candidate(&mut candidates, current);
    } else if ["groq", "openai", "claude"].contains(&engine.as_str()) {
        let requested = resolve_fast_cloud_candidate(pool, &engine, model_override)
            .await?
            .ok_or_else(|| format!("{engine} is selected for live translation but no API key is configured"))?;
        push_unique_candidate(&mut candidates, requested);
        if let Ok(current) = resolve_provider_config(pool).await {
            push_unique_candidate(&mut candidates, current);
        }
    } else {
        return Err(format!("Unsupported live translation engine: {engine}"));
    }

    if candidates.is_empty() {
        return Err("No live translation provider is configured. Add Groq/OpenAI/Claude credentials or configure a summary provider.".to_string());
    }
    Ok(candidates)
}

async fn warm_ollama_candidate(config: &TranslationProviderConfig) -> Result<(), String> {
    if config.provider != LLMProvider::Ollama {
        return Ok(());
    }
    let host = config
        .ollama_endpoint
        .clone()
        .unwrap_or_else(|| "http://localhost:11434".to_string());
    TRANSLATION_HTTP_CLIENT
        .post(format!("{}/api/generate", host.trim_end_matches('/')))
        .json(&serde_json::json!({
            "model": config.model_name,
            "keep_alive": "10m",
            "stream": false
        }))
        .timeout(Duration::from_secs(120))
        .send()
        .await
        .map_err(|error| format!("Failed to warm Ollama model: {error}"))?
        .error_for_status()
        .map_err(|error| format!("Failed to warm Ollama model: {error}"))?;
    Ok(())
}

async fn translate_with_candidate<R: Runtime>(
    app: &AppHandle<R>,
    config: &TranslationProviderConfig,
    request_id: &str,
    text: &str,
    source: Option<LanguageSpec>,
    target: LanguageSpec,
    context_text: Option<&str>,
    glossary: Option<&str>,
    context_hint: Option<&str>,
    cancellation_token: &CancellationToken,
    budgets: TranslationBudgets,
) -> Result<(String, u64), String> {
    let worker_pool = if uses_local_translation_worker(&config.provider) {
        &*LOCAL_TRANSLATION_SEMAPHORE
    } else {
        &*CLOUD_TRANSLATION_SEMAPHORE
    };
    let _permit = tokio::select! {
        permit = worker_pool.acquire() => permit.map_err(|_| "Live translation worker pool is unavailable.".to_string())?,
        _ = cancellation_token.cancelled() => return Err("Live translation was cancelled.".to_string()),
    };

    let attempt_started = Instant::now();
    let (system_prompt, user_prompt) = build_translation_prompts(
        text,
        source,
        target,
        context_text,
        glossary,
        context_hint,
    );
    let app_data_dir = app.path().app_data_dir().ok();
    let max_tokens = Some(LIVE_TRANSLATION_MAX_TOKENS);
    let provider_name = config.provider_name.clone();
    let model_name = config.model_name.clone();
    let emit_request_id = request_id.to_string();
    let mut last_emit: Option<Instant> = None;
    let mut emit_text = |translated: &str, first_word_ms: u64| {
        if last_emit.is_some_and(|at| at.elapsed() < DELTA_EMIT_INTERVAL) {
            return;
        }
        last_emit = Some(Instant::now());
        let _ = app.emit(
            "live-translation-delta",
            serde_json::json!({
                "requestId": emit_request_id,
                "text": clean_translation_output(translated),
                "provider": provider_name,
                "model": model_name,
                "firstWordLatencyMs": first_word_ms,
            }),
        );
    };

    if config.provider == LLMProvider::BuiltInAI {
        let future = generate_summary(
            &TRANSLATION_HTTP_CLIENT,
            &config.provider,
            &config.model_name,
            &config.api_key,
            &system_prompt,
            &user_prompt,
            None,
            None,
            max_tokens,
            None,
            None,
            app_data_dir.as_ref(),
            None,
        );
        let result = timeout(budgets.first_word, future)
            .await
            .map_err(|_| format!("first translated word exceeded {}ms", budgets.first_word.as_millis()))??;
        let first = attempt_started.elapsed().as_millis().min(u64::MAX as u128) as u64;
        emit_text(&result, first);
        return Ok((result, first));
    }

    if config.provider == LLMProvider::OpenAICodex {
        let dir = app_data_dir.as_deref().ok_or_else(|| {
            "app_data_dir is required for OpenAI Codex provider".to_string()
        })?;
        let response = timeout(
            budgets.first_word,
            crate::openai_codex::open_codex_stream(
                &TRANSLATION_HTTP_CLIENT,
                dir,
                &config.model_name,
                &system_prompt,
                &user_prompt,
                max_tokens,
            ),
        )
        .await
        .map_err(|_| format!("first translated word exceeded {}ms", budgets.first_word.as_millis()))??;
        return stream_sse(
            response,
            codex_delta,
            &mut emit_text,
            attempt_started,
            budgets.first_word,
        )
        .await;
    }

    let request = build_chat_request(
        &TRANSLATION_HTTP_CLIENT,
        &config.provider,
        &config.model_name,
        &config.api_key,
        &system_prompt,
        &user_prompt,
        config.ollama_endpoint.as_deref(),
        config.custom_openai_endpoint.as_deref(),
        max_tokens,
        if config.provider == LLMProvider::CustomOpenAI {
            config.temperature.or(Some(0.1))
        } else {
            config.temperature
        },
        config.top_p,
        true,
    )?;
    let response = timeout(budgets.first_word, request.send())
        .await
        .map_err(|_| format!("first translated word exceeded {}ms", budgets.first_word.as_millis()))?
        .map_err(|error| format!("Failed to send translation request: {error}"))?;
    if !response.status().is_success() {
        let status = response.status();
        let body = response.text().await.unwrap_or_else(|_| "Unknown error".to_string());
        return Err(format!("translation provider returned {status}: {body}"));
    }
    let extract: fn(&Value) -> Result<Option<String>, String> = if config.provider == LLMProvider::Claude {
        claude_delta
    } else {
        chat_delta
    };
    stream_sse(
        response,
        extract,
        &mut emit_text,
        attempt_started,
        budgets.first_word,
    )
    .await
}

