name: MeetOdds native compile
on:
  push:
    branches: [feat/p0-capture-summaries]
    paths:
      - '.github/workflows/meetodds-native-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meetodds-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Compile actual Rust/Tauri commands, not a distributable app with packaged sidecars.
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: meetodds-native-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: meetodds-native-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compile actual desktop command and service integration
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml --lib --locked
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: meetodds-native-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
