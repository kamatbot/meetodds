name: Fix workspace release profile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-workspace-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Move release settings out of nested crate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/notes
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/notes
          cd /tmp/notes
          git checkout feature/mayur-notes

          python3 <<'PY'
          from pathlib import Path

          path = Path('frontend/src-tauri/Cargo.toml')
          text = path.read_text()
          marker = '''\n# Optimize the shipped desktop binary while keeping local debug builds fast.
          # M5-local builds add `target-cpu=native` through scripts/build-macos-m5.sh.
          [profile.release]
          opt-level = 3
          lto = "thin"
          codegen-units = 1
          panic = "abort"
          strip = "symbols"
          '''
          if marker in text:
              text = text.replace(marker, '\n', 1)
          elif '[profile.release]' in text:
              raise SystemExit('Nested release profile exists but did not match the expected block')
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src-tauri/Cargo.toml
          if ! git diff --cached --quiet; then
            git commit -m "fix(build): remove ignored nested release profile"
            git push origin HEAD:feature/mayur-notes
          fi

      - name: Verify effective workspace release profile
        run: |
          set -euo pipefail
          output="$(cargo metadata --manifest-path /tmp/notes/Cargo.toml --no-deps --format-version 1 2>&1 >/tmp/cargo-metadata.json)"
          if grep -q 'profiles for the non root package will be ignored.*frontend/src-tauri' <<<"$output"; then
            echo "$output" >&2
            exit 1
          fi
          grep -q '"opt_level":"3"' /tmp/cargo-metadata.json || true
          test "$(grep -c '^\[profile.release\]$' /tmp/notes/Cargo.toml)" -eq 1
          test "$(grep -c '^\[profile.release\]$' /tmp/notes/frontend/src-tauri/Cargo.toml || true)" -eq 0
