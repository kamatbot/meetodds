name: Streaming transcript backend checkpoint

on:
  push:
    branches: [feature/streaming-live-transcripts]
    paths:
      - .github/workflows/streaming-live-transcripts-backend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/streaming-live-transcripts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply backend milestone
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/streaming-live-transcripts
          git merge --no-edit origin/main
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/scripts/implement_streaming_live_subtitles.py')
          text = p.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old in text:\n        return text.replace(old, new, 1)\n    if new in text:\n        return text\n    raise SystemExit(f"Missing anchor for {label}: {old[:180]!r}")\n'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old in text:\n        return text.replace(old, new, 1)\n    if new in text:\n        return text\n    def indented(value: str, prefix: str) -> str:\n        return "\\n".join(prefix + line if line else line for line in value.split("\\n"))\n    for prefix in ("    ", "        ", "            ", "                ", "                    ", "                        ", "                            "):\n        candidate = indented(old, prefix)\n        if candidate in text:\n            return text.replace(candidate, indented(new, prefix), 1)\n    raise SystemExit(f"Missing anchor for {label}: {old[:180]!r}")\n'''
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
          python3 frontend/scripts/patch_streaming_harness_v3.py
          python3 frontend/scripts/patch_streaming_harness_v4.py
          python3 frontend/scripts/implement_streaming_live_subtitles.py backend
          rustfmt --edition 2021 \
            frontend/src-tauri/src/audio/vad.rs \
            frontend/src-tauri/src/audio/pipeline.rs \
            frontend/src-tauri/src/audio/recording_manager.rs \
            frontend/src-tauri/src/audio/transcription/worker.rs \
            frontend/src-tauri/src/audio/transcription/live_preview.rs \
            frontend/src-tauri/src/audio/transcription/mod.rs \
            frontend/src-tauri/src/audio/recording_commands.rs \
            frontend/src-tauri/src/whisper_engine/whisper_engine.rs
          git add frontend/src-tauri/src
          git commit -m "feat(transcript): add latest-only speculative subtitle ASR lane"
          git push origin HEAD:feature/streaming-live-transcripts
      - name: Remove backend checkpoint workflow
        run: |
          git rm .github/workflows/streaming-live-transcripts-backend.yml
          git commit -m "chore(ci): remove subtitle backend checkpoint harness"
          git push origin HEAD:feature/streaming-live-transcripts
