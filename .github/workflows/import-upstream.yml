name: Apply and validate M5 performance milestone

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m5-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Apply M5 runtime and build tuning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/notes
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/notes
          cd /tmp/notes
          git checkout feature/mayur-notes

          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(text: str, source: str, replacement: str, label: str) -> str:
              if source not in text:
                  if replacement in text:
                      return text
                  raise SystemExit(f'Could not find patch anchor for {label}')
              return text.replace(source, replacement, 1)

          whisper_path = Path('frontend/src-tauri/src/whisper_engine/whisper_engine.rs')
          whisper = whisper_path.read_text()

          whisper = replace_once(
              whisper,
              """        // Set thread count based on hardware (if supported by whisper.cpp)
                  if let Some(_max_threads) = adaptive_config.max_threads {
                      // Note: whisper.cpp may or may not expose thread control through params
                      // Removed debug log to reduce I/O overhead in transcription hot path
                  }
          """,
              """        // Apply the hardware profile. whisper-rs defaults to at most four
                  // decoder threads, which leaves substantial M-series CPU capacity unused.
                  if let Some(max_threads) = adaptive_config.max_threads {
                      params.set_n_threads(max_threads as i32);
                  }
          """,
              'primary decoder thread count',
          )

          whisper = replace_once(
              whisper,
              "        params.set_temperature(0.3);             // Lower than 0.4 for consistency, higher than 0.0 for quality\n",
              "        params.set_temperature(adaptive_config.temperature);\n",
              'adaptive temperature',
          )

          whisper = replace_once(
              whisper,
              """        params.set_max_len(200);                 // Reasonable length
                  params.set_single_segment(false);        // Allow multiple segments for better accuracy

                  // Note: compression_ratio_threshold would be ideal but not available in current whisper-rs
          """,
              """        params.set_max_len(200);                 // Reasonable length
                  params.set_single_segment(false);        // Allow multiple segments for better accuracy

                  if let Some(max_threads) = adaptive_config.max_threads {
                      params.set_n_threads(max_threads as i32);
                  }

                  // Note: compression_ratio_threshold would be ideal but not available in current whisper-rs
          """,
              'streaming decoder thread count',
          )

          whisper_path.write_text(whisper)

          cargo_path = Path('frontend/src-tauri/Cargo.toml')
          cargo = cargo_path.read_text().rstrip() + '\n'
          if '[profile.release]' not in cargo:
              cargo += """
          # Optimize the shipped desktop binary while keeping local debug builds fast.
          # M5-local builds add `target-cpu=native` through scripts/build-macos-m5.sh.
          [profile.release]
          opt-level = 3
          lto = "thin"
          codegen-units = 1
          panic = "abort"
          strip = "symbols"
          """
          cargo_path.write_text(cargo)

          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['tauri:build:m5'] = 'bash scripts/build-macos-m5.sh'
          package_path.write_text(json.dumps(package, indent=4, ensure_ascii=False) + '\n')
          PY

          cat > frontend/scripts/build-macos-m5.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "$(uname -s)" != "Darwin" || "$(uname -m)" != "arm64" ]]; then
            echo "tauri:build:m5 must run on an Apple Silicon Mac." >&2
            exit 1
          fi

          logical_cores="$(sysctl -n hw.logicalcpu_max 2>/dev/null || sysctl -n hw.ncpu)"
          build_jobs="$logical_cores"
          if (( logical_cores > 4 )); then
            build_jobs=$((logical_cores - 2))
          fi

          chip_name="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
          echo "Building Notes for ${chip_name:-Apple Silicon} with ${build_jobs} parallel jobs"

          export CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS:-$build_jobs}"
          export CMAKE_BUILD_PARALLEL_LEVEL="${CMAKE_BUILD_PARALLEL_LEVEL:-$build_jobs}"
          export NEXT_TELEMETRY_DISABLED="${NEXT_TELEMETRY_DISABLED:-1}"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C target-cpu=native"

          pnpm exec tauri build -- --features metal,coreml
          EOF
          chmod +x frontend/scripts/build-macos-m5.sh

          cat > docs/M5_PERFORMANCE.md <<'EOF'
          # Apple Silicon and M5 performance

          Notes already compiles Whisper with Metal and Core ML on macOS. This milestone fixes the runtime and release-path gaps that prevented newer Apple Silicon machines from using that capacity effectively.

          ## Runtime changes

          - Detects actual physical/unified memory through `sysinfo` instead of treating every machine as 8 GB unless `MEMORY_GB` was manually set.
          - Uses an Apple-Silicon-specific balanced decoder profile: beam 3 on 16 GB or larger machines, beam 2 below 16 GB, Metal enabled, and two CPU cores reserved for audio capture, UI rendering, and macOS.
          - Applies the computed decoder thread count to both Whisper transcription paths. Previously the value was calculated and logged but discarded, leaving whisper.cpp at its four-thread default.
          - Avoids beam 5 for the high-memory Apple Silicon tier; that setting favored marginal search quality over meeting-transcription latency.
          - Removes an unconditional 200 ms sleep while the resource monitor held its write lock. Monitoring now refreshes only memory and CPU data and relies on the existing sample interval.
          - Uses available memory and actual headroom below the configured memory limit when calculating safe parallel workers.

          ## M5-native build

          On an M5 Mac from `frontend/`:

          ```bash
          pnpm tauri:build:m5
          ```

          The script verifies an arm64 macOS host, preserves two logical cores for the system during compilation, enables Metal and Core ML, and adds `-C target-cpu=native` so the local release binary can use the exact CPU features exposed by that Mac. Normal release builds remain portable across supported Apple Silicon Macs.

          The Cargo release profile now uses optimization level 3, thin LTO, one codegen unit, symbol stripping, and abort-on-panic. This improves shipped runtime performance and binary size at the cost of a slower release compile.

          ## Validation boundary

          Deterministic configuration and resource-accounting tests run on CI. The native build script is syntax-checked there. A real-time-factor benchmark still needs to be run on the target M5 hardware because an x86/Linux CI runner cannot measure Metal, Core ML, thermals, or Apple unified-memory bandwidth.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src-tauri/src/whisper_engine/whisper_engine.rs \
                  frontend/src-tauri/Cargo.toml \
                  frontend/package.json \
                  frontend/scripts/build-macos-m5.sh \
                  docs/M5_PERFORMANCE.md

          if ! git diff --cached --quiet; then
            git commit -m "perf(macos): apply adaptive threads and native M5 builds"
            git push origin HEAD:feature/mayur-notes
          fi

      - name: Parse and format changed Rust modules
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            /tmp/notes/frontend/src-tauri/src/audio/hardware_detector.rs \
            /tmp/notes/frontend/src-tauri/src/whisper_engine/system_monitor.rs
          rustfmt --edition 2021 --emit stdout \
            /tmp/notes/frontend/src-tauri/src/whisper_engine/whisper_engine.rs >/dev/null
          bash -n /tmp/notes/frontend/scripts/build-macos-m5.sh
          cargo metadata --manifest-path /tmp/notes/frontend/src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null

      - name: Test hardware and resource policies in isolation
        run: |
          set -euo pipefail
          rm -rf /tmp/perf-policy-tests
          mkdir -p /tmp/perf-policy-tests/src
          cat > /tmp/perf-policy-tests/Cargo.toml <<'EOF'
          [package]
          name = "perf-policy-tests"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          anyhow = "1"
          log = "0.4"
          serde = { version = "1", features = ["derive"] }
          sysinfo = "0.32"
          tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

          [dev-dependencies]
          tempfile = "3"
          EOF
          cat > /tmp/perf-policy-tests/src/lib.rs <<'EOF'
          #[path = "/tmp/notes/frontend/src-tauri/src/audio/hardware_detector.rs"]
          pub mod hardware_detector;
          #[path = "/tmp/notes/frontend/src-tauri/src/whisper_engine/system_monitor.rs"]
          pub mod system_monitor;
          EOF
          cargo test --manifest-path /tmp/perf-policy-tests/Cargo.toml

      - name: Verify whisper-rs 0.13 thread API
        run: |
          set -euo pipefail
          rm -rf /tmp/whisper-api-check
          mkdir -p /tmp/whisper-api-check/src
          cat > /tmp/whisper-api-check/Cargo.toml <<'EOF'
          [package]
          name = "whisper-api-check"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          whisper-rs = "=0.13.2"
          EOF
          cat > /tmp/whisper-api-check/src/main.rs <<'EOF'
          use whisper_rs::{FullParams, SamplingStrategy};

          fn main() {
              let mut params = FullParams::new(SamplingStrategy::BeamSearch {
                  beam_size: 3,
                  patience: 1.0,
              });
              params.set_n_threads(8);
          }
          EOF
          WHISPER_DONT_GENERATE_BINDINGS=1 cargo check --manifest-path /tmp/whisper-api-check/Cargo.toml

      - name: Install and build frontend
        working-directory: /tmp/notes/frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Smoke-test formatted export files
        working-directory: /tmp/notes/frontend
        run: |
          set -euo pipefail
          rm -rf /tmp/export-smoke
          pnpm exec tsc src/lib/meeting-export-formats.ts \
            --target ES2020 \
            --module commonjs \
            --outDir /tmp/export-smoke \
            --strict \
            --skipLibCheck

          node <<'NODE'
          const fs = require('fs');
          const { buildDocx, buildPdf } = require('/tmp/export-smoke/meeting-export-formats.js');
          const markdown = '# Review\n\n- Decision owned\n\n| Metric | Trend |\n| --- | --- |\n| Activation | Up |';
          fs.writeFileSync('/tmp/notes-export.docx', Buffer.from(buildDocx(markdown, { title: 'Review' })));
          fs.writeFileSync('/tmp/notes-export.pdf', Buffer.from(buildPdf(markdown, { title: 'Review' })));
          NODE

          unzip -t /tmp/notes-export.docx
          file /tmp/notes-export.docx /tmp/notes-export.pdf
          head -c 8 /tmp/notes-export.pdf | grep -a '%PDF-1.4'
