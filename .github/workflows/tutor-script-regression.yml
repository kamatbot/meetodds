name: Tutor script regression
on:
  push:
    branches: [fix/tutor-native-speech-romanized-display]
  pull_request:
    paths:
      - 'frontend/src-tauri/src/spanish/**'
      - 'frontend/src-tauri/src/languages/**'
      - 'frontend/src/components/Spanish/**'
      - 'frontend/src/lib/spanish.ts'
      - 'frontend/src/lib/practice-script.ts'
      - 'frontend/tests/lib/practice-script.test.cjs'
      - '.github/workflows/tutor-script-regression.yml'
permissions:
  contents: read
concurrency:
  group: tutor-script-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test tutor, speech validation and platform romanization
        run: cargo test --manifest-path tools/tutoring-core-tests/Cargo.toml --locked
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependency graph
        run: cd frontend && npx --yes pnpm@9.15.9 install --frozen-lockfile --ignore-scripts
      - name: Script-routing regression tests
        run: NODE_PATH="$PWD/frontend/node_modules" node --test frontend/tests/lib/practice-script.test.cjs
      - name: Lint changed frontend files
        run: cd frontend && npx next lint --file src/components/Spanish/SpanishPractice.tsx --file src/components/Spanish/PracticeText.tsx --file src/lib/spanish.ts --file src/lib/practice-script.ts
      - name: Typecheck against the unchanged main baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/meetodds-main" origin/main
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$RUNNER_TEMP/meetodds-main/frontend/node_modules"
          NODE_PATH="$PWD/frontend/node_modules" node tools/recovery/check-types.cjs "$RUNNER_TEMP/meetodds-main/frontend" frontend
