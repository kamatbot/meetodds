name: Fix and validate speaker attribution Rust integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-speaker-detection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone speaker feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/notes
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/notes
          cd /tmp/notes
          git checkout feature/speaker-detection
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fix recording DeviceType import and check in
        working-directory: /tmp/notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src-tauri/src/audio/transcription/speaker_detection.rs')
          text = path.read_text()
          old = 'use crate::audio::DeviceType;\n'
          new = 'use crate::audio::recording_state::DeviceType;\n'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected DeviceType import not found')
          PY
          rustfmt --edition 2021 frontend/src-tauri/src/audio/transcription/speaker_detection.rs
          git add frontend/src-tauri/src/audio/transcription/speaker_detection.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(speakers): use recording pipeline DeviceType"
            git push origin HEAD:feature/speaker-detection
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf >/dev/null

      - name: Provide Tauri helper resource placeholder
        working-directory: /tmp/notes
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          : > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Compile-check Tauri library
        working-directory: /tmp/notes
        env:
          WHISPER_DONT_GENERATE_BINDINGS: "1"
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo check -q -p meetily --lib --message-format short 2>&1 | tee /tmp/cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "--- compiler errors ---"
            grep -E '(^|: )(error\[|error:)' /tmp/cargo-check.log || true
            exit "$status"
          fi
