          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:160]!r}")
              write(path, text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, expected: int | None = None) -> None:
              text = read(path)
              count = text.count(old)
              if expected is not None and count != expected:
                  if count == 0 and new in text:
                      return
                  raise SystemExit(f"Expected {expected} anchors in {path}, found {count}: {old[:140]!r}")
              if count == 0:
                  if new in text:
                      return
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:140]!r}")
              write(path, text.replace(old, new))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  if replacement in text:
                      return
                  raise SystemExit(f"Regex patch failed in {path}: {pattern[:180]!r}")
              write(path, updated)

