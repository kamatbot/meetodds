                        {speaker && sourceDescription && (
                            <div className="text-xs">
                                <div>{sourceDescription}</div>
                                {speaker.confidence !== null && (
                                    <div>Speaker confidence: {Math.round(speaker.confidence * 100)}%</div>
                                )}
                            </div>
                        )}
                    </TooltipContent>
                </Tooltip>
                <div className={`flex-1 border-l-2 pl-3 ${speaker?.accentClassName ?? 'border-l-transparent'}`}>
                    {speaker && (
                        <div className="mb-1 flex items-center gap-2">
                            <span className={`inline-flex rounded-full border px-2 py-0.5 text-xs font-medium ${speaker.badgeClassName}`}>
                                {speaker.label}
                            </span>
                            {speaker.isEstimate && (
                                <span className="text-[11px] text-gray-400">best estimate</span>
                            )}
                        </div>
                    )}
                    {isStreaming ? (
                        <div className="bg-gray-100 border border-gray-200 rounded-lg px-3 py-2">
                            <p className="text-base text-gray-800 leading-relaxed">{displayText}</p>
                        </div>
                    ) : (
                        <p className="text-base text-gray-800 leading-relaxed">{displayText}</p>
                    )}
                </div>
            </div>
        </div>
    );
});

