name: Implement and validate speaker attribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-speaker-detection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Clone speaker feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/notes
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/notes
          cd /tmp/notes
          git checkout feature/speaker-detection
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate source-separated Rust pipeline
        working-directory: /tmp/notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path('frontend/scripts/apply-speaker-detection.py')
          text = patch.read_text()

          model_old = '        "    #[sqlx(default)]\\n    pub duration: Option<f64>,\\n}\\n",'
          model_new = '        "    pub duration: Option<f64>,\\n}\\n",'
          if model_old not in text:
              raise SystemExit('Transcript model patch anchor was not found in integration script')
          text = text.replace(model_old, model_new, 1)

          # The repository uses a two-line SQL literal, while the staged helper
          # expected a single-line insert. Remove that helper block and patch the
          # real source below using its exact current structure.
          text, removed = re.subn(
              r'\n    transcript_repo = "frontend/src-tauri/src/database/repositories/transcript\.rs".*?\n\n    common = ',
              '\n    common = ',
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Could not isolate transcript repository patch block')
          patch.write_text(text)

          repository = Path('frontend/src-tauri/src/database/repositories/transcript.rs')
          repository_text = repository.read_text()
          old_query = (
              '            let result = sqlx::query(\n'
              '                "INSERT INTO transcripts (id, meeting_id, transcript, timestamp, audio_start_time, audio_end_time, duration)\n'
              '                 VALUES (?, ?, ?, ?, ?, ?, ?)"\n'
              '            )\n'
          )
          new_query = (
              '            let result = sqlx::query(\n'
              '                "INSERT INTO transcripts (id, meeting_id, transcript, timestamp, audio_start_time, audio_end_time, duration, speaker, speaker_label, speaker_source, speaker_confidence)\n'
              '                 VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"\n'
              '            )\n'
          )
          if old_query not in repository_text:
              raise SystemExit('Current multiline transcript INSERT was not found')
          repository_text = repository_text.replace(old_query, new_query, 1)

          old_bind = (
              '            .bind(segment.duration)\n'
              '            .execute(&mut *transaction)\n'
          )
          new_bind = (
              '            .bind(segment.duration)\n'
              '            .bind(&segment.speaker)\n'
              '            .bind(&segment.speaker_label)\n'
              '            .bind(&segment.speaker_source)\n'
              '            .bind(segment.speaker_confidence)\n'
              '            .execute(&mut *transaction)\n'
          )
          if old_bind not in repository_text:
              raise SystemExit('Transcript INSERT bind chain was not found')
          repository.write_text(repository_text.replace(old_bind, new_bind, 1))
          PY
          python3 frontend/scripts/apply-speaker-detection.py rust
          rustfmt --edition 2021 \
            frontend/src-tauri/src/audio/transcription/speaker_detection.rs \
            frontend/src-tauri/src/audio/transcription/mod.rs \
            frontend/src-tauri/src/audio/transcription/worker.rs \
            frontend/src-tauri/src/audio/pipeline.rs \
            frontend/src-tauri/src/audio/recording_commands.rs \
            frontend/src-tauri/src/audio/recording_saver.rs \
            frontend/src-tauri/src/audio/common.rs \
            frontend/src-tauri/src/database/models.rs \
            frontend/src-tauri/src/database/repositories/transcript.rs \
            frontend/src-tauri/src/database/repositories/meeting.rs \
            frontend/src-tauri/src/api/api.rs
          git add frontend/src-tauri
          git commit -m "feat(speakers): preserve source channels and persist attribution"
          git push origin HEAD:feature/speaker-detection

      - name: Integrate speaker-aware transcript experience
        working-directory: /tmp/notes
        run: |
          set -euo pipefail
          python3 frontend/scripts/apply-speaker-detection.py frontend
          git add frontend/src docs/SPEAKER_DETECTION.md
          git commit -m "feat(speakers): render attributed turns and inform summaries"
          git push origin HEAD:feature/speaker-detection

      - name: Validate acoustic clustering and database migration
        working-directory: /tmp/notes
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            frontend/src-tauri/src/audio/transcription/speaker_detection.rs \
            frontend/src-tauri/src/audio/transcription/mod.rs \
            frontend/src-tauri/src/audio/transcription/worker.rs \
            frontend/src-tauri/src/audio/pipeline.rs \
            frontend/src-tauri/src/audio/recording_commands.rs \
            frontend/src-tauri/src/audio/recording_saver.rs \
            frontend/src-tauri/src/audio/common.rs \
            frontend/src-tauri/src/database/models.rs \
            frontend/src-tauri/src/database/repositories/transcript.rs \
            frontend/src-tauri/src/database/repositories/meeting.rs \
            frontend/src-tauri/src/api/api.rs

          rm -rf /tmp/speaker-engine-tests
          mkdir -p /tmp/speaker-engine-tests/src
          printf '%s\n' \
            '[package]' \
            'name = "speaker-engine-tests"' \
            'version = "0.1.0"' \
            'edition = "2021"' \
            '' \
            '[dependencies]' \
            'realfft = "=3.4.0"' \
            > /tmp/speaker-engine-tests/Cargo.toml
          printf '%s\n' \
            'pub mod audio {' \
            '    #[derive(Debug, Clone, PartialEq, Eq)]' \
            '    pub enum DeviceType { Microphone, System }' \
            '}' \
            '' \
            '#[path = "/tmp/notes/frontend/src-tauri/src/audio/transcription/speaker_detection.rs"]' \
            'pub mod speaker_detection;' \
            > /tmp/speaker-engine-tests/src/lib.rs
          cargo test --manifest-path /tmp/speaker-engine-tests/Cargo.toml

          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.execute('CREATE TABLE transcripts (id TEXT PRIMARY KEY, meeting_id TEXT NOT NULL, transcript TEXT NOT NULL, timestamp TEXT NOT NULL, speaker TEXT)')
          db.executescript(Path('frontend/src-tauri/migrations/20260902090000_add_speaker_metadata.sql').read_text())
          columns = {row[1] for row in db.execute('PRAGMA table_info(transcripts)')}
          assert {'speaker', 'speaker_label', 'speaker_source', 'speaker_confidence'} <= columns
          indexes = {row[1] for row in db.execute('PRAGMA index_list(transcripts)')}
          assert 'idx_transcripts_meeting_speaker' in indexes
          print('speaker migration validated')
          PY

      - name: Frozen install and production frontend build
        working-directory: /tmp/notes/frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build
