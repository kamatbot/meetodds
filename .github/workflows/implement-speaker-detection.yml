name: Finalize and validate speaker attribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-speaker-detection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone speaker feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/notes
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/notes
          cd /tmp/notes
          git checkout feature/speaker-detection
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Strengthen voice separation and fix channel ownership
        working-directory: /tmp/notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'Missing patch anchor in {path}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1))

          speaker = Path('frontend/src-tauri/src/audio/transcription/speaker_detection.rs')
          replace_once(
              speaker,
              '    let mut frame_features: Vec<Vec<f32>> = Vec::new();\n',
              '    let mut frame_features: Vec<Vec<f32>> = Vec::new();\n'
              '    let mut last_pitch = (0.0f32, 0.0f32);\n',
          )
          replace_once(
              speaker,
              '''        let (pitch_hz, pitch_strength) = if frame_number % 4 == 0 {
            estimate_pitch(frame, sample_rate)
        } else {
            (0.0, 0.0)
        };
''',
              '''        // Pitch autocorrelation is the most expensive frame feature. Sample it
        // every fourth frame, then carry the latest observation through the
        // intervening frames so the segment-level mean remains discriminative.
        if frame_number % 4 == 0 {
            last_pitch = estimate_pitch(frame, sample_rate);
        }
        let (pitch_hz, pitch_strength) = last_pitch;
''',
          )
          replace_once(
              speaker,
              '            normalized_pitch,\n',
              '            normalized_pitch * 1.75,\n',
          )

          pipeline = Path('frontend/src-tauri/src/audio/pipeline.rs')
          replace_once(
              pipeline,
              '        let segments = match device_type {\n',
              '        let segments = match &device_type {\n',
          )
          replace_once(
              pipeline,
              '        let source_name = match device_type {\n',
              '        let source_name = match &device_type {\n',
          )
          PY

          rustfmt --edition 2021 \
            frontend/src-tauri/src/audio/transcription/speaker_detection.rs \
            frontend/src-tauri/src/audio/pipeline.rs

          git add frontend/src-tauri/src/audio/transcription/speaker_detection.rs \
                  frontend/src-tauri/src/audio/pipeline.rs
          git commit -m "fix(speakers): strengthen clustering and channel ownership"
          git push origin HEAD:feature/speaker-detection

      - name: Validate acoustic clustering and database migration
        working-directory: /tmp/notes
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            frontend/src-tauri/src/audio/transcription/speaker_detection.rs \
            frontend/src-tauri/src/audio/transcription/mod.rs \
            frontend/src-tauri/src/audio/transcription/worker.rs \
            frontend/src-tauri/src/audio/pipeline.rs \
            frontend/src-tauri/src/audio/recording_commands.rs \
            frontend/src-tauri/src/audio/recording_saver.rs \
            frontend/src-tauri/src/audio/common.rs \
            frontend/src-tauri/src/database/models.rs \
            frontend/src-tauri/src/database/repositories/transcript.rs \
            frontend/src-tauri/src/database/repositories/meeting.rs \
            frontend/src-tauri/src/api/api.rs

          rm -rf /tmp/speaker-engine-tests
          mkdir -p /tmp/speaker-engine-tests/src
          printf '%s\n' \
            '[package]' \
            'name = "speaker-engine-tests"' \
            'version = "0.1.0"' \
            'edition = "2021"' \
            '' \
            '[dependencies]' \
            'realfft = "=3.4.0"' \
            > /tmp/speaker-engine-tests/Cargo.toml
          printf '%s\n' \
            'pub mod audio {' \
            '    #[derive(Debug, Clone, PartialEq, Eq)]' \
            '    pub enum DeviceType { Microphone, System }' \
            '}' \
            '' \
            '#[path = "/tmp/notes/frontend/src-tauri/src/audio/transcription/speaker_detection.rs"]' \
            'pub mod speaker_detection;' \
            > /tmp/speaker-engine-tests/src/lib.rs
          cargo test --manifest-path /tmp/speaker-engine-tests/Cargo.toml

          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.execute('CREATE TABLE transcripts (id TEXT PRIMARY KEY, meeting_id TEXT NOT NULL, transcript TEXT NOT NULL, timestamp TEXT NOT NULL, speaker TEXT)')
          db.executescript(Path('frontend/src-tauri/migrations/20260902090000_add_speaker_metadata.sql').read_text())
          columns = {row[1] for row in db.execute('PRAGMA table_info(transcripts)')}
          assert {'speaker', 'speaker_label', 'speaker_source', 'speaker_confidence'} <= columns
          indexes = {row[1] for row in db.execute('PRAGMA index_list(transcripts)')}
          assert 'idx_transcripts_meeting_speaker' in indexes
          print('speaker migration validated')
          PY

      - name: Frozen install and production frontend build
        working-directory: /tmp/notes/frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Linux dependencies for Rust check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Compile-check the Tauri library
        working-directory: /tmp/notes
        env:
          WHISPER_DONT_GENERATE_BINDINGS: "1"
        run: cargo check -p meetily --lib
