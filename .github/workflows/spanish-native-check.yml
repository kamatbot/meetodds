name: Spanish native integration
on:
  push:
    branches: [feat/spanish-tutoring-engine]
    paths:
      - '.github/workflows/spanish-native-check.yml'
      - 'frontend/src-tauri/src/spanish/provider.rs'
      - 'frontend/src-tauri/src/summary/summary_engine/client.rs'
      - 'frontend/src-tauri/src/lib.rs'
  pull_request:
    paths:
      - 'frontend/src-tauri/src/spanish/**'
      - 'frontend/src-tauri/src/summary/summary_engine/client.rs'
permissions:
  contents: read
concurrency:
  group: spanish-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: meetodds-native-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: meetodds-native-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compile real native integration, not an app release
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml --lib --locked
