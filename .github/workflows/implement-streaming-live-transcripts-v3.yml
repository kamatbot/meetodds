name: Implement streaming live transcripts v3

on:
  push:
    branches: [feature/streaming-live-transcripts]
    paths:
      - .github/workflows/implement-streaming-live-transcripts-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/streaming-live-transcripts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync current main and harden harness
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/streaming-live-transcripts
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/scripts/implement_streaming_live_subtitles.py')
          text = p.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old in text:\n        return text.replace(old, new, 1)\n    if new in text:\n        return text\n    raise SystemExit(f"Missing anchor for {label}: {old[:180]!r}")\n'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old in text:\n        return text.replace(old, new, 1)\n    if new in text:\n        return text\n\n    def indented(value: str, prefix: str) -> str:\n        return "\\n".join(prefix + line if line else line for line in value.split("\\n"))\n\n    for prefix in ("    ", "        ", "            ", "                ", "                    ", "                        ", "                            "):\n        candidate = indented(old, prefix)\n        if candidate in text:\n            return text.replace(candidate, indented(new, prefix), 1)\n    raise SystemExit(f"Missing anchor for {label}: {old[:180]!r}")\n'''
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
          python3 frontend/scripts/patch_streaming_harness_v3.py

      - name: Milestone 1 - speculative subtitle ASR lane
        run: |
          set -euo pipefail
          python3 frontend/scripts/implement_streaming_live_subtitles.py backend
          rustfmt --edition 2021 \
            frontend/src-tauri/src/audio/vad.rs \
            frontend/src-tauri/src/audio/pipeline.rs \
            frontend/src-tauri/src/audio/recording_manager.rs \
            frontend/src-tauri/src/audio/transcription/worker.rs \
            frontend/src-tauri/src/audio/transcription/live_preview.rs \
            frontend/src-tauri/src/audio/transcription/mod.rs \
            frontend/src-tauri/src/audio/recording_commands.rs \
            frontend/src-tauri/src/whisper_engine/whisper_engine.rs
          git add frontend/src-tauri/src
          git commit -m "feat(transcript): add latest-only speculative subtitle ASR lane"
          git push origin HEAD:feature/streaming-live-transcripts

      - name: Milestone 2 - subtitle UI and live translation handoff
        run: |
          set -euo pipefail
          python3 frontend/scripts/implement_streaming_live_subtitles.py frontend
          git add \
            frontend/src/types/index.ts \
            frontend/src/contexts/TranscriptContext.tsx \
            frontend/src/components/LiveTranscriptSubtitle.tsx \
            frontend/src/hooks/useLiveTranslation.ts \
            frontend/src/app/_components/TranscriptPanel.tsx
          git commit -m "feat(transcript): render ephemeral live subtitles during speech"
          git push origin HEAD:feature/streaming-live-transcripts

      - name: Milestone 3 - performance cleanup and docs
        run: |
          set -euo pipefail
          python3 frontend/scripts/implement_streaming_live_subtitles.py performance
          git add frontend/src/contexts/TranscriptContext.tsx docs/STREAMING_LIVE_TRANSCRIPTS.md
          git commit -m "perf(transcript): trim live-render latency and hot-path logging"
          git push origin HEAD:feature/streaming-live-transcripts

      - name: Static invariants
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          grep -q 'live_speech_snapshot' frontend/src-tauri/src/audio/vad.rs
          grep -q 'watch::Sender<Option<AudioChunk>>' frontend/src-tauri/src/audio/pipeline.rs
          grep -q 'transcribe_audio_preview' frontend/src-tauri/src/whisper_engine/whisper_engine.rs
          grep -q 'live-transcript-preview' frontend/src-tauri/src/audio/transcription/live_preview.rs
          grep -q 'CANONICAL_TRANSCRIPTION_BUSY' frontend/src-tauri/src/audio/transcription/worker.rs
          grep -q 'LiveTranscriptSubtitle' frontend/src/app/_components/TranscriptPanel.tsx
          grep -q 'previewTranslation' frontend/src/hooks/useLiveTranslation.ts
          grep -q 'livePreview' frontend/src/contexts/TranscriptContext.tsx
          git diff --check origin/main...HEAD

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config \
            libglib2.0-dev libasound2-dev libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf >/dev/null

      - name: Provide Tauri helper placeholder
        run: |
          mkdir -p frontend/src-tauri/binaries
          : > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Frozen frontend production build
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Native Rust compile check
        env:
          WHISPER_DONT_GENERATE_BINDINGS: "1"
          CARGO_TERM_COLOR: never
        run: cargo check -q -p meetily --lib --message-format short

      - name: Remove implementation helpers
        if: success()
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/implement-streaming-live-transcripts.yml \
            .github/workflows/implement-streaming-live-transcripts-v2.yml \
            .github/workflows/implement-streaming-live-transcripts-v3.yml \
            frontend/scripts/implement_streaming_live_subtitles.py \
            frontend/scripts/patch_streaming_harness_v3.py
          git commit -m "chore(ci): remove streaming transcript implementation harnesses"
          git push origin HEAD:feature/streaming-live-transcripts
