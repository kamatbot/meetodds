name: MeetOdds iOS
on:
  push:
    branches: [feat/native-ios-meetodds]
    paths: ['ios/**', '.github/workflows/meetodds-ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/meetodds-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meetodds-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26 SDK
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Test portable meeting core
        run: cd ios/MeetOddsCore && swift test
      - name: Install project generator
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build native app and Live Activity extension
        run: |
          cd ios
          xcodegen generate --spec project.yml
          set -o pipefail
          xcodebuild -project MeetOdds.xcodeproj -scheme MeetOdds -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meetodds-ios-build
          path: |
            ios/build.log
            ios/MeetOdds.xcodeproj
          retention-days: 7
