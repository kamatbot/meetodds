name: Streaming transcript performance checkpoint

on:
  push:
    branches: [feature/streaming-live-transcripts]
    paths:
      - .github/workflows/streaming-live-transcripts-performance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/streaming-live-transcripts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply performance milestone
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/streaming-live-transcripts
          git merge --no-edit origin/main
          python3 frontend/scripts/implement_streaming_live_subtitles.py performance
          git add frontend/src/contexts/TranscriptContext.tsx docs/STREAMING_LIVE_TRANSCRIPTS.md
          git commit -m "perf(transcript): trim live-render latency and hot-path logging"
          git push origin HEAD:feature/streaming-live-transcripts
      - name: Remove performance checkpoint workflow
        run: |
          git rm .github/workflows/streaming-live-transcripts-performance.yml
          git commit -m "chore(ci): remove subtitle performance checkpoint harness"
          git push origin HEAD:feature/streaming-live-transcripts
