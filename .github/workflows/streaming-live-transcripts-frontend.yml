name: Streaming transcript frontend checkpoint

on:
  push:
    branches: [feature/streaming-live-transcripts]
    paths:
      - .github/workflows/streaming-live-transcripts-frontend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/streaming-live-transcripts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply frontend milestone
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/streaming-live-transcripts
          git merge --no-edit origin/main
          python3 frontend/scripts/implement_streaming_live_subtitles.py frontend
          git add \
            frontend/src/types/index.ts \
            frontend/src/contexts/TranscriptContext.tsx \
            frontend/src/components/LiveTranscriptSubtitle.tsx \
            frontend/src/hooks/useLiveTranslation.ts \
            frontend/src/app/_components/TranscriptPanel.tsx
          git commit -m "feat(transcript): render ephemeral live subtitles during speech"
          git push origin HEAD:feature/streaming-live-transcripts
      - name: Remove frontend checkpoint workflow
        run: |
          git rm .github/workflows/streaming-live-transcripts-frontend.yml
          git commit -m "chore(ci): remove subtitle frontend checkpoint harness"
          git push origin HEAD:feature/streaming-live-transcripts
