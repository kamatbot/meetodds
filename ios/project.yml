name: MeetOdds
options:
  bundleIdPrefix: com.meetodds
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '2'
    GENERATE_INFOPLIST_FILE: NO
    # Signing lives here because MeetOdds.xcodeproj is generated by xcodegen and is
    # gitignored: anything set by hand in Xcode is destroyed by the next
    # `make project`. Declaring the team in the spec is what makes it survive.
    # A team identifier is not a secret; it ships inside every distributed build.
    DEVELOPMENT_TEAM: B4F73U5RGR
    CODE_SIGN_STYLE: Automatic
packages:
  MeetOddsCore:
    path: MeetOddsCore
targets:
  MeetOdds:
    type: application
    platform: iOS
    sources:
      - path: MeetOdds
      - path: Shared
      - path: ../frontend/src-tauri/templates
        type: folder
        buildPhase: resources
    dependencies:
      - package: MeetOddsCore
      - target: MeetOddsLiveActivity
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: MeetOdds
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        # Answers the export-compliance prompt once, so Xcode stops asking on every
        # upload. False because the app's only cryptography is exempt: TLS through
        # URLSession and Keychain storage, both Apple OS encryption, plus a SHA-256
        # certificate fingerprint used solely to authenticate the paired Mac.
        # Hashing for authentication is not non-exempt encryption. Revisit if the app
        # ever encrypts user content itself or ships its own cipher.
        ITSAppUsesNonExemptEncryption: false
        # App Store upload validation (error 90713) reads this top-level key. actool
        # only emits the nested CFBundleIcons/CFBundlePrimaryIcon entries, so without
        # this line the archive is rejected even though the icons are present.
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        NSMicrophoneUsageDescription: Record meetings you choose, entirely on this device.
        NSSpeechRecognitionUsageDescription: Create an on-device transcript of your recorded meetings.
        NSLocalNetworkUsageDescription: Connect to your explicitly paired Mac for ChatGPT subscription summaries.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad multitasking requires all four orientations, upside-down included, or
        # upload validation rejects the build with error 90474. UIRequiresFullScreen
        # is not an escape hatch: it is deprecated and iPadOS 26 expects multitasking.
        'UISupportedInterfaceOrientations~ipad': [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [meetodds]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetodds.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MeetOddsLiveActivity:
    type: app-extension
    platform: iOS
    sources: [MeetOddsLiveActivity, Shared]
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: MeetOdds Recording
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetodds.ios.liveactivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MeetOddsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MeetOddsUITests]
    dependencies:
      - target: MeetOdds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetodds.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MeetOdds:
    build:
      targets:
        MeetOdds: all
        MeetOddsLiveActivity: all
    test:
      targets: [MeetOddsUITests]
      gatherCoverageData: false
