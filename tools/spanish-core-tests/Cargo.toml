[package]
name = "meetodds-spanish-core-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Independent workspace: run pure/core tests without Tauri, audio, GPU or a model.
[workspace]

[lib]
name = "spanish_core"
path = "../../frontend/src-tauri/src/spanish/mod.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
