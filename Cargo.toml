[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Optimize the shipped desktop binary while keeping local debug builds fast.
# M5-local builds add `target-cpu=native` through frontend/scripts/build-macos-m5.sh.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Dev builds: keep our crate quick to compile but optimize dependencies, so
# whisper.cpp / ONNX Runtime / DSP crates run at release speed under `tauri dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[patch."https://github.com/emotechlab/silero-rs"]
silero = { path = "frontend/src-tauri/vendor/silero" }
