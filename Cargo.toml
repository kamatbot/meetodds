[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Optimize the shipped desktop binary while keeping local debug builds fast.
# Host-only experiments can opt into LOCAL_CPU_NATIVE=1; distributed apps stay portable.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# macOS 27 rejects misaligned LINKEDIT tables emitted when Rust strips some
# proc-macro dylibs (rust-lang/rust#157750). They run only while compiling, so
# leave build-time dependencies intact; the shipped binaries remain stripped.
[profile.release.build-override]
strip = "none"

# Dev builds: keep our crate quick to compile but optimize dependencies, so
# DSP and decoding crates run at release speed under `tauri dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
